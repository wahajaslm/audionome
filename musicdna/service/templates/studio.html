<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>Music DNA · Research</title>
<meta name="claude:viewport-fit-sides" content="cover">
<script src="/vendor/d3.min.js" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js'"></script>
<script src="/vendor/echarts.min.js" onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js'"></script>
<style>
:root{
  --bg:#0E0E10; --side:#0B0B0D; --panel:#151518; --raise:#1B1B1F; --line:#1F1F23; --line2:#2C2C31;
  --fg:#DCDCE0; --sub:#A1A1A6; --mute:#85858B; --off:#45454B; --accent:#8EC5B8;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none !important}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;margin:0;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:1px solid var(--fg);outline-offset:2px}
.app{display:flex;min-height:100%}

/* Seamless DAW Audio Intelligence Timeline Stack */
.daw-stack{background:var(--panel);border:1px solid var(--line2);border-radius:14px;margin-top:28px;margin-bottom:28px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,0.45)}
.daw-hud{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:rgba(255,255,255,0.015);border-bottom:1px solid var(--line2);flex-wrap:wrap;gap:12px}
.daw-hud-left{display:flex;align-items:center;gap:12px}
.daw-hud-title{font-size:15px;font-weight:600;letter-spacing:-.01em;color:var(--fg)}
.daw-hud-badge{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);background:rgba(142,197,184,0.12);padding:2px 8px;border-radius:6px;border:1px solid rgba(142,197,184,0.25)}
.daw-hud-sub{font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
.daw-hud-readout{font-size:12.5px;color:var(--sub);display:flex;align-items:center;gap:12px;font-variant-numeric:tabular-nums}
.daw-hud-readout b{color:var(--accent);font-weight:500}

.daw-lanes-container{position:relative;user-select:none;-webkit-user-select:none;touch-action:none;cursor:crosshair;background:#0E0E10}

/* Playhead, Selection, and Hover Overlays spanning all lanes */
.daw-playhead{position:absolute;top:0;bottom:0;width:2px;background:#FFFFFF;box-shadow:0 0 10px rgba(255,255,255,0.9),0 0 2px #FFFFFF;pointer-events:none;z-index:22;transform:translateX(-999px);will-change:transform}
.daw-playhead-cap{display:none}
.daw-selection{position:absolute;top:0;bottom:0;background:rgba(142,197,184,0.11);border-left:1.5px solid #8EC5B8;border-right:1.5px solid #8EC5B8;pointer-events:none;z-index:10;display:none;will-change:left,width}
.daw-hover-line{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,0.45);border-left:1px dashed rgba(255,255,255,0.65);pointer-events:none;z-index:15;transform:translateX(-999px);will-change:transform}

/* Stacked DAW Lanes */
.daw-lane{position:relative;border-bottom:1px solid rgba(255,255,255,0.06);background:transparent}
.daw-lane-header{display:flex;align-items:center;justify-content:space-between;padding:9px 18px 7px;gap:12px;position:relative;z-index:30;background:#131316;border-bottom:1px solid rgba(255,255,255,0.04);flex-wrap:wrap}
.daw-lane-label{display:flex;align-items:center;gap:8px}
.daw-lane-num{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:var(--raise);color:var(--sub);font-size:11px;font-weight:600}
.daw-lane-name{font-size:13px;font-weight:600;color:var(--fg)}
.daw-lane-meta{font-size:11.5px;color:var(--mute);margin-left:4px}
.daw-lane-legend{display:flex;align-items:center;gap:12px}
.daw-pill{font-size:11.5px;color:var(--sub);display:inline-flex;align-items:center;gap:6px;user-select:none}
.daw-pill i{display:inline-block;width:12px;height:2.5px;border-radius:1px}
.daw-scale-tag{font-size:11px;color:var(--mute);background:rgba(255,255,255,0.03);padding:1px 6px;border-radius:4px}

.daw-canvas-wrap{position:relative;width:100%}
.daw-canvas{display:block;width:100%;pointer-events:none}
.daw-svg{display:block;width:100%;pointer-events:none}
.daw-ruler-wrap{position:relative;width:100%;background:rgba(0,0,0,0.22)}
.daw-ruler-svg{display:block;width:100%;pointer-events:none}

/* sidebar */
.side{width:244px;flex:none;box-sizing:border-box;height:100vh;position:sticky;top:0;background:var(--side);border-right:1px solid var(--line);padding:28px 14px 18px max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:28px}
.brand{font-size:13px;font-weight:600;letter-spacing:.14em;color:var(--sub);padding:0 10px;display:flex;align-items:center;justify-content:space-between}
.nav{display:flex;flex-direction:column;gap:2px}
.nv{height:42px;border:0;background:none;border-radius:10px;padding:0 10px;display:flex;align-items:center;gap:12px;font-size:15px;color:var(--sub);cursor:pointer;text-align:left;text-decoration:none}
.nv:hover,.nv[aria-current="page"]{background:var(--raise);color:var(--fg)}
.nv .badge{margin-left:auto;font-size:12px;color:var(--mute)}
.sec{font-size:12px;color:var(--mute);letter-spacing:.06em;padding:0 10px;margin-bottom:6px}
.coll{height:36px;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* main */
main{flex:1;min-width:0;box-sizing:border-box;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.col{max-width:1000px;margin:0 auto;display:flex;flex-direction:column}
.pcol{min-height:calc(100vh - 100px)}

/* track & waveform */
.track{display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px;margin-top:12px}
.track .t{font-size:26px;font-weight:400}
.track .a{font-size:15px;color:var(--sub);margin-top:4px}
.wfwrap{margin-top:32px;position:relative}
.wcap{text-align:center;font-size:13px;color:var(--mute);min-height:18px;margin-top:10px;margin-bottom:20px}
#wf{position:relative;height:140px;touch-action:none;cursor:crosshair;user-select:none;-webkit-user-select:none}
#bars{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between}
#bars i{display:block;width:2px;border-radius:1px;flex:none}
.band{position:absolute;top:8px;bottom:8px;border-radius:8px;pointer-events:none}
.band.sel{background:rgba(142,197,184,.06);border:1px solid rgba(142,197,184,.25)}
#ph{position:absolute;top:-6px;bottom:-6px;width:1px;background:rgba(220,220,224,.5);pointer-events:none}
.savedots{position:relative;height:12px}
.savedots b{position:absolute;top:3px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--accent)}
#tbwrap{position:relative;height:0;transition:height .2s ease}
#tbwrap.on{height:58px}
.tb{position:absolute;top:10px;height:44px;box-sizing:border-box;display:flex;align-items:center;gap:2px;padding:0 4px 0 14px;background:var(--panel);border:1px solid var(--line2);border-radius:12px;white-space:nowrap;z-index:3;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.tb .rng{font-size:13px;color:var(--sub);padding-right:10px;margin-right:2px;border-right:1px solid var(--line2)}
.tbb{height:36px;padding:0 10px;border:0;border-radius:8px;background:none;display:flex;align-items:center;gap:7px;font-size:14px;cursor:pointer}
.tbb:hover{background:var(--raise)}
.tbb[aria-pressed="true"]{background:var(--raise);color:var(--accent)}
.tbx{width:32px;height:36px;border:0;background:none;color:var(--mute);cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:8px}

/* slot / ask / strip */
.slot{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s ease;margin-top:4px}
.slot.open{grid-template-rows:1fr}
.slot>div{overflow:hidden;min-height:0}
.ask{display:flex;align-items:center;gap:8px;min-height:44px;padding:4px 10px;border:1px solid var(--line2);background:var(--panel);border-radius:12px;overflow-x:auto;scrollbar-width:none}
.ask::-webkit-scrollbar{display:none}
.ask .qq{flex:none;font-size:14px;display:flex;align-items:center;gap:8px;margin-right:4px}
.chip{height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line2);background:none;color:#B4B4B9;font-size:13px;cursor:pointer}
.chip.sq{border-radius:8px}
.ask .chip{flex:none;height:28px;font-size:12px;padding:0 10px}
.chip[aria-pressed="true"]{background:rgba(220,220,224,.12);color:var(--fg);border-color:rgba(220,220,224,.35)}
.primary{height:38px;padding:0 18px;border-radius:19px;border:0;background:var(--fg);color:#111113;font-size:14px;font-weight:500;cursor:pointer}
.ghost{height:38px;padding:0 14px;border-radius:19px;border:0;background:none;color:var(--sub);font-size:14px;cursor:pointer}
.ghost:hover{color:var(--fg)}
.outline{height:38px;padding:0 16px;border-radius:19px;border:1px solid var(--line2);background:none;font-size:14px;cursor:pointer}

/* playback bar */
.pbar{position:sticky;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:8;margin-top:auto;box-sizing:border-box;background:var(--bg);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:12px 0}
.pbar .pl{font-size:13px;color:var(--mute);white-space:nowrap}
.pbar .pl .now{color:var(--fg)}
.pbar .pr{display:flex;align-items:center;justify-content:flex-end;gap:10px;color:var(--sub)}
.tp{display:flex;align-items:center;justify-content:center;gap:14px}
.ib{width:44px;height:44px;border:0;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:50%;color:var(--fg)}
.ib.side-b{color:var(--sub)}
.ib:hover{background:var(--raise)}
.ib[aria-pressed="true"]{color:var(--accent)}
.play{width:52px;height:52px;border:1px solid rgba(220,220,224,.45);border-radius:50%;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
.vol{width:110px;accent-color:#A1A1A6}

/* pages & seamless hairline lists */
.ph1{font-size:30px;font-weight:400;margin:0}
.lead{color:var(--sub);margin:8px 0 0;line-height:1.5;max-width:65ch}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--mute)}
.sh{font-size:18px;font-weight:500;margin:40px 0 4px}
.shs{font-size:13px;color:var(--mute);margin:0 0 12px}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.tab{height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line2);background:none;color:#B4B4B9;font-size:14px;cursor:pointer}
.tab[aria-selected="true"]{background:rgba(220,220,224,.12);color:var(--fg);border-color:rgba(220,220,224,.35)}
.list{list-style:none;margin:16px 0 0;padding:0;border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:18px;padding:14px 0;border-bottom:1px solid var(--line)}
.row .mw{width:150px;height:30px;display:flex;align-items:center;justify-content:space-between;flex:none}
.row .mw i{display:block;width:2px;border-radius:1px}
.row .info{flex:1;min-width:0}
.row .info .s{font-size:16px}
.row .info .s span{color:var(--mute)}
.row .info .w{font-size:13px;color:var(--sub);margin-top:3px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tags span{font-size:12px;color:var(--sub);border:1px solid var(--line2);border-radius:6px;padding:2px 7px}
.row .r{font-size:13px;color:var(--mute);white-space:nowrap}
.cplay{width:40px;height:40px;flex:none;border:1px solid var(--line2);border-radius:50%;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
.cplay:hover{border-color:var(--sub)}
.pill{font-size:12px;border-radius:10px;padding:2px 8px;border:1px solid var(--line2);color:var(--sub);white-space:nowrap;background:none}
.pill.ok{color:var(--accent);border-color:rgba(142,197,184,.3)}
.lrow{display:flex;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.lrow .info{flex:1;min-width:0}
.lrow .s{font-size:15px}.lrow .s span{color:var(--mute)}
.lrow .meta{font-size:12px;color:var(--mute);margin-top:3px}
.prog{width:90px;height:2px;background:var(--line2);position:relative;flex:none}
.prog i{position:absolute;left:0;top:0;height:2px;background:var(--mute)}
.prog.on i{background:var(--accent)}

/* ring & traits — authentic fine-tick waveform barcode + circumplex core */
.ringstage{position:relative;height:530px;margin:16px 0 10px}
.ringstage #ring{position:absolute;left:50%;top:50%;width:420px;height:420px;margin:-210px 0 0 -210px}
#ring .rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--mute);text-align:center;pointer-events:none;z-index:2}
.rc-box{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 14px;border-radius:14px;background:rgba(14,14,16,0.76);backdrop-filter:blur(6px);border:1px solid rgba(220,220,224,0.06)}
#ring .rn{font-size:46px;font-weight:300;line-height:1;color:var(--fg);transition:color .2s}
#ring .rt{font-size:14.5px;color:var(--fg);max-width:180px;margin-top:2px}
#ring .rc span:last-child{color:var(--mute);font-size:11.5px;margin-top:2px}
.rlab{position:absolute;border:0;background:none;cursor:pointer;display:flex;flex-direction:column;gap:2px;padding:6px 10px;border-radius:8px;color:var(--sub);font-size:13px;white-space:nowrap;font-family:inherit;transition:all .18s ease}
.rlab b{font-size:20px;font-weight:400;color:var(--fg);line-height:1.1}
.rlab:hover b,.rlab.on b{color:var(--accent)}
.rlab:hover span,.rlab.on span{color:var(--fg)}
.rlab:hover{background:var(--raise)}

/* Center Russell Affect Classification Plane */
.circumplex-plane{
  position:absolute;left:50%;top:50%;width:290px;height:290px;margin:-145px 0 0 -145px;
  border-radius:50%;border:1px solid rgba(220,220,224,0.08);
  background:radial-gradient(circle at center, rgba(27,27,31,0.7) 0%, rgba(14,14,16,0.95) 85%);
  overflow:hidden;box-sizing:border-box;
}
.circumplex-plane .axis-h{position:absolute;left:20px;right:20px;top:50%;height:1px;background:rgba(220,220,224,0.07)}
.circumplex-plane .axis-v{position:absolute;top:20px;bottom:20px;left:50%;width:1px;background:rgba(220,220,224,0.07)}
.circumplex-plane .iso-ring{
  position:absolute;left:50%;top:50%;width:145px;height:145px;margin:-73px 0 0 -73px;
  border-radius:50%;border:1px dashed rgba(220,220,224,0.05);pointer-events:none;
}
.quad{position:absolute;font-size:9.5px;letter-spacing:0.08em;color:rgba(161,161,166,0.65);text-transform:uppercase;font-weight:500;user-select:none;pointer-events:none}
.q-tr{top:36px;right:28px}
.q-tl{top:36px;left:28px}
.q-bl{bottom:36px;left:28px}
.q-br{bottom:36px;right:28px}
.circumplex-svg{position:absolute;inset:0;width:100%;height:100%}
.portrait{font-size:clamp(19px,2.2vw,24px);font-weight:300;line-height:1.55;text-align:center;max-width:760px;margin:20px auto 0;text-wrap:balance}
.pw{all:unset;display:inline;font:inherit;color:var(--fg);cursor:pointer;border-bottom:1px solid rgba(142,197,184,.5);transition:color .18s, border-bottom-color .18s}
.pw:hover,.pw.on{color:var(--accent);border-bottom-color:var(--accent)}
.pmeta{text-align:center;font-size:13px;color:var(--mute);margin:12px 0 0}
.tlist{border-top:1px solid var(--line);margin-top:16px}
.trow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,260px) 220px;align-items:center;gap:8px 24px;padding:14px 0;border-bottom:1px solid var(--line)}
.tmain{display:flex;align-items:center;gap:14px;border:0;background:none;padding:0;text-align:left;cursor:pointer;min-width:0}
.tname{font-size:16px;color:var(--fg)}
.tname small{display:block;font-size:13px;color:var(--mute);margin-top:3px}
.trow.on .tname{color:var(--accent)}
.meter{display:none!important}
.hear{display:flex;align-items:center;gap:12px;font-size:14px}
.hear b{font-weight:500}
.hear small{display:block;color:var(--mute);font-size:12px;margin-top:2px}
.tans{display:flex;justify-content:flex-end;align-items:center;gap:12px;font-size:13px;color:var(--sub)}
.cnote{color:var(--accent);font-size:13px}
.trow .tdetail{grid-column:1/-1;padding:10px 0 4px 32px;margin:0}
.evr{display:flex;align-items:center;gap:12px;min-height:42px;font-size:14px;border-bottom:1px solid var(--line)}
.evr:last-child{border-bottom:0}
.evr .x{flex:1;min-width:0}
.evr .x span{color:var(--mute)}
.across{font-size:13px;color:var(--sub);margin:2px 0 8px}

/* seamless hairline plot rows — strictly unboxed, tokens only */
.prow{padding:22px 0 16px;border-bottom:1px solid var(--line);min-width:0}
.prow > div{min-width:0;overflow:hidden}
.prow-head{display:flex;align-items:flex-end;justify-content:space-between;gap:8px 24px;margin-bottom:12px;flex-wrap:wrap}
.prow-title{font-size:15px;font-weight:500;color:var(--fg);letter-spacing:-.005em}
.prow-sub{font-size:12.5px;color:var(--mute);margin-top:3px}
.legend{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px 18px;font-size:12px;color:var(--sub)}
.lg{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.lg i{display:inline-block;width:14px;height:2px;border-radius:1px}
.lg i.dash{height:0;border-top:2px dashed;background:none!important}
.lg b{color:var(--fg);font-weight:500}
.prow-stat{font-size:13px;color:var(--sub);display:flex;align-items:center;gap:14px}
.prow-stat b{color:var(--accent);font-weight:400}
canvas.pcanvas{display:block;width:100%!important;max-width:100%;box-sizing:border-box;cursor:crosshair;user-select:none;-webkit-user-select:none}

/* Unified M3 Acoustic DNA Ring + Russell Circumplex Core */
.dna-hero{display:grid;grid-template-columns:minmax(340px,660px) minmax(280px,1fr);gap:28px;align-items:start;margin:16px 0 28px}
@media(max-width:980px){.dna-hero{grid-template-columns:1fr}}
.dna-ring-card{background:#111114;border:1px solid var(--line2);border-radius:16px;padding:18px;position:relative;display:flex;flex-direction:column;align-items:center;box-shadow:0 16px 40px rgba(0,0,0,0.38)}
.dna-ring-svg{width:100%;max-width:640px;height:auto;display:block;overflow:visible;user-select:none}
.dna-hud-bar{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;margin-top:8px;background:#16161A;border:1px solid var(--line);border-radius:10px;font-size:12.5px;color:var(--sub);min-height:40px}
.dna-hud-bar b{color:var(--fg);font-weight:500}
.dna-side-panel{display:flex;flex-direction:column;gap:16px}
.dna-card{background:#111114;border:1px solid var(--line2);border-radius:12px;padding:16px 18px}
.dna-card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.dna-card-title{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--mute)}
.dna-quad-pill{font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:rgba(142,197,184,0.14);color:var(--accent);border:1px solid rgba(142,197,184,0.3)}
.dna-kv-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 14px}
.dna-kv{display:flex;flex-direction:column;gap:2px}
.dna-kv small{font-size:11px;color:var(--mute)}
.dna-kv b{font-size:15px;font-weight:500;color:var(--fg);font-variant-numeric:tabular-nums}
.dna-inst-row{display:grid;grid-template-columns:86px 1fr 42px;align-items:center;gap:10px;font-size:12.5px;padding:4px 0}
.dna-inst-track{height:7px;background:#1C1C21;border-radius:4px;overflow:hidden;position:relative}
.dna-inst-fill{height:100%;border-radius:4px}
.dna-stem-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.dna-stem-box{background:#16161A;border:1px solid var(--line);border-radius:8px;padding:8px 10px;text-align:center}
.dna-stem-box small{display:block;font-size:11px;color:var(--mute)}

</style>

<div class="app">
  <aside class="side" aria-label="Sidebar">
    <div class="brand">MUSIC DNA<span class="pill">Research</span></div>
    <nav class="nav" id="nav"></nav>

      <div class="sec">RECORDINGS</div>
      <div class="nav" id="tracks-nav"></div>

      <button class="nv" data-act="upload"><svg width="18" height="18" aria-hidden="true"><use href="#i-plus"/></svg>Analyze audio file</button>

<div class="toast" id="toast" role="status" hidden></div>
<input type="file" id="file-input" accept="audio/*,.wav,.mp3,.flac,.ogg,.m4a,.aac,.opus" hidden>
<audio id="audio" preload="auto" src="/api/audio/original-demo"></audio>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const svg=(id,w)=>'<svg width="'+w+'" height="'+w+'" aria-hidden="true"><use href="#'+id+'"/></svg>';
  const fmt=s=>{s=Math.max(0,Math.round(s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
  const esc=x=>String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const NOTES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];

  const initV = (new URLSearchParams(window.location.search).get('view') || window.location.hash.replace('#','') || 'waveform');
  let S={
    view: ['waveform','ring','embeddings','active','files','models'].includes(initV) ? initV : 'waveform',
    playing:false,
    t:0,
    hoverT:null,
    dur:32,
    sel:{a:0,b:12},
    loop:false,
    trait:0,
    etab:0,
    anchorIdx:0,
    showAllWindows:false,
    openWin:-1,
    data:null,
    fav:null,
    sqliteTracks:[],
    analyzing:null
  };

  const audio=$('audio');
  let toastT, pendingSeek=null, seekGuardUntil=0, audioCtx=null;
  S.peaks=[];
  S.previewEnd=null;

  function seekTo(sec, endSec=null){
    const target=Math.max(0,Math.min(S.dur||32,Number(sec)||0));
    S.t=target;
    S.previewEnd=endSec;
    seekGuardUntil=Date.now()+300;
    if(audio.readyState>=1){
      try{audio.currentTime=target;}catch(e){pendingSeek=target;}
    }else{
      pendingSeek=target;
    }
    if(typeof updateDawPlayhead==='function') updateDawPlayhead();
  }

  audio.addEventListener('loadedmetadata',()=>{
    if(audio.duration&&Number.isFinite(audio.duration)&&Math.abs(audio.duration-(S.dur||0))>1){
      S.dur=audio.duration;
    }
    if(pendingSeek!==null){
      try{audio.currentTime=pendingSeek;S.t=pendingSeek;}catch(e){}
      pendingSeek=null;
      if(S.view==='waveform'){drawWave();drawSpectralCanvases();}
    }
  });

  function toast(msg){
    const el=$('toast');el.textContent=msg;el.hidden=false;
    clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true;},4000);
  }

  function cosine(a,b){
    if(!a||!b||a.length!==b.length)return 0;
    let d=0,na=0,nb=0;
    for(let i=0;i<a.length;i++){d+=a[i]*b[i];na+=a[i]*a[i];nb+=b[i]*b[i];}
    return (na&&nb)?d/Math.sqrt(na*nb):0;
  }

  function level(v){return v>=0.75?4:v>=0.5?3:v>=0.25?2:v>0.05?1:0;}
  function meterHtml(lvl){return '';}

  function vectorBars(vec,highlight){
    const slice=(vec||[]).slice(0,40);
    return slice.map(v=>{
      const h=Math.max(2,Math.min(28,Math.round(Math.abs(v)*110)));
      const col=highlight?(v>=0?'var(--accent)':'rgba(142,197,184,.45)'):(v>=0?'rgba(220,220,224,.78)':'var(--off)');
      return '<i style="height:'+h+'px;background:'+col+'"></i>';
    }).join('');
  }

  async function inspectSelection(){
    if(!S.data||!S.sel)return;
    const res=await fetch('/api/studio/inspect-passage',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        analysis:S.data.multimodal,
        startSec:S.sel.a,
        endSec:S.sel.b,
        note:'',
        qualities:[]
      })
    }).catch(()=>null);
    if(res&&res.ok)S.fav=await res.json();
  }

  async function loadSqliteList(){
    const res=await fetch('/api/db/analyses').catch(()=>null);
    if(!res||!res.ok)return;
    const rows=await res.json().catch(()=>[]);
    if(!Array.isArray(rows))return;
    const byKey=new Map();
    for(const r of rows){
      if(r.trackId==='original-demo')continue;
      const cleanTitle=(r.title&&r.title!==r.trackId)?r.title:r.trackId;
      const dedup=cleanTitle.toLowerCase()+'|'+Math.round((r.durationSec||0)/2);
      if(!byKey.has(dedup)){
        byKey.set(dedup,{trackId:r.trackId,title:cleanTitle,durationSec:r.durationSec||0,methods:[r.method]});
      }else{
        const item=byKey.get(dedup);
        if(!item.methods.includes(r.method))item.methods.push(r.method);
      }
    }
    S.sqliteTracks=Array.from(byKey.values());
  }

  async function loadTrackById(trackId, switchToWaveform=false){
    const label=trackId==='original-demo'?'First Light':(S.sqliteTracks.find(t=>t.trackId===trackId)?.title||trackId);
    S.analyzing={name:label,step:2,pct:65,msg:'Loading continuous librosa STFT plots and multimodal embeddings…'};
    render();
    try{audio.pause();}catch(e){}
    S.playing=false;S.t=0;S.previewEnd=null;pendingSeek=0;
    audio.src='/api/audio/'+encodeURIComponent(trackId);
    audio.load();
    const url=trackId==='original-demo'?'/api/studio/demo':'/api/studio/track/'+encodeURIComponent(trackId);
    try{
      const res=await fetch(url);
      if(res.ok){
        S.data=await res.json();
        S.peaks=S.data.spectralPlots?.waveformPeaks||[];
        S.dur=S.data.multimodal?.durationSec||32;
        S.sel={a:0,b:Math.min(12,S.dur)};
        seekTo(0,null);
        await inspectSelection();
      }
    }catch(err){
      console.error('Failed to load track data:', err);
    }finally{
      S.analyzing=null;
      if(switchToWaveform && !['ring','embeddings','active','files','models'].includes(initV))S.view='waveform';
      render();
    }
  }

  async function loadDemo(forceDemo=false){
    await loadSqliteList();
    const firstUp=!forceDemo&&S.sqliteTracks[0];
    if(firstUp){
      await loadTrackById(firstUp.trackId,false);
    }else{
      await loadTrackById('original-demo',false);
    }
  }

  function renderSidebar(){
    const views=[
      ['waveform','Waveform & plots','i-wave'],
      ['ring','Acoustic DNA ring','i-dna'],
      ['embeddings','Embedding space','i-compass'],
      ['active','Active learning & DMER','i-spark'],
      ['files','Recordings & upload','i-lib'],
      ['models','Models & licenses','i-lock']
    ];
    $('nav').innerHTML=views.map(v=>
      '<button class="nv" data-act="view" data-v="'+v[0]+'"'+(S.view===v[0]?' aria-current="page"':'')+'>'+svg(v[2],18)+v[1]+'</button>'
    ).join('');

    let tHtml='<button class="nv coll" data-act="load-demo"'+(S.data?.trackId==='original-demo'?' aria-current="page"':'')+'>First Light (Demo)</button>';
    for(const t of S.sqliteTracks){
      const isCur=S.data?.trackId===t.trackId||S.data?.title===t.title;
      tHtml+='<button class="nv coll" data-act="load-sqlite" data-v="'+esc(t.trackId)+'"'+(isCur?' aria-current="page"':'')+'>'+esc(t.title)+'</button>';
    }
    $('tracks-nav').innerHTML=tHtml;
  }

  function renderPbar(){
    return '<div class="pbar" aria-label="Playback">'+
      '<div class="pl"><span class="now" id="tnow">'+fmt(S.t)+'</span> / '+fmt(S.dur)+'</div>'+
      '<div class="tp">'+
        '<button class="ib side-b" data-act="seek" data-v="-6" aria-label="Back 6 seconds">'+svg('i-prev',20)+'</button>'+
        '<button class="play" data-act="play" aria-label="'+(S.playing?'Pause':'Play')+'">'+svg(S.playing?'i-pause':'i-play',20)+'</button>'+
        '<button class="ib side-b" data-act="seek" data-v="6" aria-label="Forward 6 seconds">'+svg('i-next',20)+'</button>'+
        '<button class="ib side-b" data-act="loop" aria-pressed="'+S.loop+'" aria-label="Loop selection">'+svg('i-loop',20)+'</button>'+
      '</div>'+
      '<div class="pr">'+svg('i-vol',18)+'<input class="vol" id="vol" type="range" min="0" max="100" value="'+Math.round(audio.volume*100)+'"></div>'+
    '</div>';
  }

  function getPassageStats(){
    const sp=S.data?.spectralPlots;
    if(!sp||!sp.curves)return null;
    const N=sp.nBins||400, dur=S.dur||32;
    const a=S.sel?S.sel.a:0, b=S.sel?S.sel.b:dur;
    const i0=Math.max(0,Math.min(N-1,Math.floor(a/dur*N)));
    const i1=Math.max(i0+1,Math.min(N,Math.ceil(b/dur*N)));
    const mean=arr=>arr&&arr.length?arr.reduce((x,y)=>x+y,0)/arr.length:0;
    const meanSel=arr=>arr&&arr.length?mean(arr.slice(i0,i1)):0;
    const c=sp.curves;
    const segs=S.data?.multimodal?.segments||[];
    const selSegs=segs.filter(s=>Math.max(a,s.startSec)<Math.min(b,s.endSec));
    const active=selSegs.length?selSegs:segs;
    const slope=active.reduce((acc,s)=>acc+Number(s.descriptors?.energy_slope||0),0)/Math.max(1,active.length);
    const chromaSel=NOTES.map((_,p)=>meanSel(sp.chroma?.[p]||[]));
    const chromaAll=NOTES.map((_,p)=>mean(sp.chroma?.[p]||[]));
    return {
      flatSel:meanSel(c.flatness), flatAll:mean(c.flatness),
      tonSel:meanSel(c.tonality), tonAll:mean(c.tonality),
      centSel:meanSel(c.centroidHz), centAll:mean(c.centroidHz),
      rollSel:meanSel(c.rolloffHz), rollAll:mean(c.rolloffHz),
      vocSel:meanSel(c.vocalRatio), vocAll:mean(c.vocalRatio),
      lowSel:meanSel(c.lowBandRatio),
      rmsSel:meanSel(c.rms), rmsAll:mean(c.rms),
      fluxSel:meanSel(c.flux), fluxAll:mean(c.flux),
      onsetSel:meanSel(c.onset), onsetAll:mean(c.onset),
      zcrSel:meanSel(c.zcr), zcrAll:mean(c.zcr),
      slope, chromaSel, chromaAll
    };
  }

  /* ---------- View 1: Waveform & All 8 Continuous Python Spectral Plots ---------- */
  function renderWaveformView(){
    const mm=S.data?.multimodal;
    const segs=mm?.segments||[];
    const prompt=S.fav?.trompaPrompt||{question:'Select a passage on the waveform or any plot to inspect.',chips:['Vocals','Melody','Instruments','Rhythm','Build-up']};
    const contrast=S.fav?.contrast||{};
    const ps=getPassageStats();

    const pctDiff=(sel,all)=>all>1e-6?Math.round((sel-all)/all*100):0;
    const fmtDiff=d=>(d>=0?'+':'')+d+'% vs avg';

    // 12-Pitch Chroma Comparison Bars (Selected Passage vs Full Track Avg)
    let chromaBarsHtml='';
    if(ps&&ps.chromaSel){
      const maxC=Math.max(0.01,...ps.chromaSel,...ps.chromaAll);
      const domIdx=ps.chromaSel.indexOf(Math.max(...ps.chromaSel));
      chromaBarsHtml='<div style="display:flex;align-items:center;justify-content:space-between;margin:18px 0 8px;padding-left:'+PLOT_PAD_L+'px;padding-right:'+PLOT_PAD_R+'px">'+
          '<span style="font-size:12.5px;color:var(--sub)">Pitch-class profile · dominant <b style="color:var(--fg);font-weight:500">'+NOTES[domIdx]+'</b></span>'+
          '<span class="legend"><span class="lg"><i style="background:var(--accent);height:8px;width:8px;border-radius:2px"></i>Selection</span><span class="lg"><i style="background:var(--off);height:8px;width:8px;border-radius:2px"></i>Track average</span></span>'+
        '</div>'+
        '<div style="display:grid;grid-template-columns:repeat(12,1fr);gap:0;margin-left:'+PLOT_PAD_L+'px;margin-right:'+PLOT_PAD_R+'px;border-bottom:1px solid var(--line2)">'+
        NOTES.map((n,i)=>{
          const hSel=Math.round(ps.chromaSel[i]/maxC*52);
          const hAll=Math.round(ps.chromaAll[i]/maxC*52);
          return '<div style="height:56px;display:flex;align-items:flex-end;justify-content:center;gap:2px" title="'+n+' · selection '+ps.chromaSel[i].toFixed(2)+' · track avg '+ps.chromaAll[i].toFixed(2)+'">'+
              '<i style="width:9px;height:'+Math.max(1,hSel)+'px;background:var(--accent);opacity:'+(i===domIdx?1:.7)+';border-radius:2px 2px 0 0"></i>'+
              '<i style="width:9px;height:'+Math.max(1,hAll)+'px;background:var(--off);border-radius:2px 2px 0 0"></i>'+
          '</div>';
        }).join('')+
        '</div>'+
        '<div style="display:grid;grid-template-columns:repeat(12,1fr);margin-left:'+PLOT_PAD_L+'px;margin-right:'+PLOT_PAD_R+'px;padding-top:6px">'+
          NOTES.map((n,i)=>'<span style="text-align:center;font-size:11px;color:'+(i===domIdx?'var(--fg)':'var(--mute)')+'">'+n+'</span>').join('')+
        '</div>';
    }

    const selWindows=segs.map((s,i)=>({s,i})).filter(({s})=>S.sel&&Math.max(S.sel.a,s.startSec)<Math.min(S.sel.b,s.endSec));
    const visibleWindows=S.showAllWindows?segs.map((s,i)=>({s,i})):(selWindows.length?selWindows:segs.slice(0,6).map((s,i)=>({s,i})));

    const rows=visibleWindows.map(({s,i})=>{
      const d=s.descriptors||{};
      const isSel=S.sel&&Math.max(S.sel.a,s.startSec)<Math.min(S.sel.b,s.endSec);
      const isOpen=S.openWin===i;
      const isWinPlaying=S.playing&&S.t>=s.startSec&&S.t<=s.endSec;
      const slope=Number(d.energy_slope||0);
      const slopeLabel=slope>0.03?'Intensifying (+'+slope.toFixed(2)+'/s)':slope<-0.03?'Decaying ('+slope.toFixed(2)+'/s)':'Steady ('+slope.toFixed(2)+'/s)';
      const chroma=d.chroma||[];
      const dspVec=s.dspEmbedding||(s.embedding||[]).slice(0,25);
      const mfccs=dspVec.slice(17,25);
      const deepVec=s.deepEmbedding||(s.embedding||[]);
      let detail='';
      if(isOpen){
        detail='<div class="tdetail">'+
          '<p class="across">Window '+(i+1)+' ('+fmt(s.startSec)+' – '+fmt(s.endSec)+') — click row to collapse</p>'+
          '<div class="evr"><span class="x"><b>8 Acoustic Descriptors</b> <span>— RMS '+Number(d.energy||0).toFixed(5)+' · Slope '+(slope>=0?'+':'')+slope.toFixed(4)+'/s · Vocal '+Math.round((d.vocal_presence||0)*100)+'% · Brightness '+Math.round(d.brightness_hz||0)+' Hz · Flatness '+Number(d.noisiness||0).toFixed(4)+' · Flux '+Number(d.spectral_flux||0).toFixed(4)+' · Onset '+Number(d.onset_activity||0).toFixed(4)+' · ZCR '+Number(d.zero_crossing_rate||0).toFixed(4)+'</span></span></div>'+
          '<div class="evr"><span class="x"><b>12-Pitch Chroma Profile</b> <span>— '+NOTES.map((n,ci)=>n+': '+Number(chroma[ci]||0).toFixed(2)).join(' · ')+'</span></span></div>'+
          '<div class="evr"><span class="x"><b>8 MFCC Coefficients</b> <span>— '+mfccs.map((m,mi)=>'c'+(mi+1)+': '+Number(m).toFixed(3)).join(' · ')+'</span></span></div>'+
          '<div class="evr"><span class="x"><b>64-D Deep Neural Vector</b> <span>— ['+deepVec.slice(0,12).map(v=>Number(v).toFixed(3)).join(', ')+'…]</span></span></div>'+
        '</div>';
      }
      return '<div class="trow'+(isSel?' on':'')+'">'+
        '<button class="tmain" data-act="sel-win" data-v="'+i+'" aria-expanded="'+isOpen+'">'+
          '<span class="tname">Window '+(i+1)+' · '+fmt(s.startSec)+' – '+fmt(s.endSec)+'<small>Vocal '+Math.round((d.vocal_presence||0)*100)+'% · '+slopeLabel+' · '+Math.round(d.brightness_hz||0)+' Hz · Flatness '+Number(d.noisiness||0).toFixed(4)+'</small></span>'+
        '</button>'+
        '<div class="hear"><button class="cplay" style="width:34px;height:34px" data-act="play-win" data-v="'+i+'" aria-label="Play window">'+svg(isWinPlaying?'i-pause':'i-play',11)+'</button><span><b>RMS '+Number(d.energy||0).toFixed(4)+'</b><small>Flux '+Number(d.spectral_flux||0).toFixed(3)+' · Onset '+Number(d.onset_activity||0).toFixed(2)+'</small></span></div>'+
        '<div class="tans"><div class="mw" style="width:120px" aria-hidden="true">'+vectorBars(s.deepEmbedding||s.embedding,isSel)+'</div></div>'+
        detail+
      '</div>';
    }).join('');

    const diagRow=ps?

  function drawWave(){
    const wf=$('wf');if(!wf||!S.data)return;
    const W=wf.clientWidth||800, N=Math.max(40,Math.floor((W+3)/5)), H=wf.clientHeight-20;
    const segs=S.data.multimodal.segments||[];
    let h='',seed=17;
    for(let i=0;i<N;i++){
      seed=(seed*9301+49297)%233280;
      const x=(i+.5)/N, ts=x*S.dur;
      let amp;
      if(S.peaks&&S.peaks.length){
        amp=S.peaks[Math.min(S.peaks.length-1,Math.floor(x*S.peaks.length))];
      }else{
        const seg=segs.find(s=>ts>=s.startSec&&ts<=s.endSec)||segs[0];
        const e=seg?Math.min(1,seg.descriptors.energy*4.2):0.3;
        amp=Math.max(0.05,Math.min(1,e*(0.55+0.45*(seed/233280))));
      }
      let c='var(--off)';
      if(S.sel&&ts>=S.sel.a&&ts<=S.sel.b)c='var(--accent)';
      else if(ts<=S.t)c='rgba(220,220,224,.78)';
      h+='<i style="height:'+Math.max(2,Math.round(amp*H))+'px;background:'+c+'"></i>';
    }
    $('bars').innerHTML=h;
    $('bands').innerHTML=S.sel?'<div class="band sel" style="left:'+(S.sel.a/S.dur*W-4)+'px;width:'+((S.sel.b-S.sel.a)/S.dur*W+8)+'px"></div>':'';
    $('ph').style.left=(S.t/S.dur*W)+'px';
    if($('tnow'))$('tnow').textContent=fmt(S.t);

    const tbw=$('tbwrap');
    if(tbw&&S.sel){
      tbw.classList.add('on');
      tbw.innerHTML='<div class="tb" id="tb" role="toolbar" aria-label="Selected passage">'+
        '<span class="rng">'+fmt(S.sel.a)+' – '+fmt(S.sel.b)+'</span>'+
        '<button class="tbb" data-act="play-sel">'+svg(S.playing?'i-pause':'i-play',14)+'Listen</button>'+
        '<button class="tbb" data-act="loop" aria-pressed="'+S.loop+'">'+svg('i-loop',16)+'Loop</button>'+
        '<button class="tbb" data-act="view" data-v="ring">'+svg('i-dna',16)+'Inspect DNA</button>'+
        '<button class="tbx" data-act="clear-sel" aria-label="Clear selection">'+svg('i-x',14)+'</button>'+
      '</div>';
      const tb=$('tb'), c=(S.sel.a+S.sel.b)/2/S.dur*W;
      tb.style.left=Math.max(0,Math.min(W-tb.offsetWidth,c-tb.offsetWidth/2))+'px';
    }else if(tbw){tbw.innerHTML='';tbw.classList.remove('on');}

  function bindWave(){
    const wf=$('wf');if(!wf)return;
    let x0=null,px0=0,drag=false;
    const tAt=e=>{const r=wf.getBoundingClientRect();return Math.max(0,Math.min(S.dur,(e.clientX-r.left)/Math.max(1,r.width)*S.dur));};
    wf.onpointerdown=e=>{x0=tAt(e);px0=e.clientX;drag=false;wf.setPointerCapture(e.pointerId);};
    wf.onpointermove=e=>{
      const t=tAt(e);
      S.hoverT=t;
      if(x0===null){return;}
      if(!drag&&Math.abs(e.clientX-px0)>6)drag=true;
      if(drag){
        S.sel={a:Math.min(x0,t),b:Math.max(x0,t)};
        drawWave();
        updateDawSelection();
      }
    };
    wf.onpointerleave=()=>{if(x0===null){S.hoverT=null;}};
    wf.onpointerup=async e=>{
      if(x0===null)return;
      const t=tAt(e);
      if(!drag){
        if(S.sel&&t>=S.sel.a&&t<=S.sel.b){seekTo(t,S.sel.b);}
        else{seekTo(t,null);}
        drawWave();
        updateDawPlayhead();
      }
      else{
        if(S.sel.b-S.sel.a<Math.min(3,S.dur*0.1))S.sel.b=Math.min(S.dur,S.sel.a+Math.min(3,S.dur*0.1));
        seekTo(S.sel.a,S.sel.b);
        updateDawSelection();
        updateDawPlayhead();
        try{await audio.play();S.playing=true;}catch(err){}
        await inspectSelection();
        render();
      }
      x0=null;
    };
  }

  /* ---------- High-DPI plot engine: shared time axis, nice ticks, dual y-axes, synced selection ---------- */
  const PLOT_PAD_L=56, PLOT_PAD_R=48, PLOT_PAD_T=8, PLOT_PAD_B=24;
  const PLOT_FONT='500 10.5px -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif';
  const AX_TXT='#6E6E75', GRID='rgba(255,255,255,0.055)', BASE='rgba(255,255,255,0.16)';

  /* perceptual colour maps (anchor stops, linearly interpolated) */
  const LUT_MAGMA=[[0,0,4],[28,16,68],[79,18,123],[129,37,129],[181,54,122],[229,80,100],[251,135,97],[254,194,135],[252,253,191]];
  const LUT_CHROMA=[[13,13,16],[20,40,42],[38,82,80],[76,135,125],[142,197,184],[226,244,238]];
  const LUT_DIVERGE=[[110,140,210],[62,82,128],[22,22,27],[132,66,78],[226,128,140]];
  function lutRgb(lut,t){
    t=Math.max(0,Math.min(1,t||0));
    const f=t*(lut.length-1), i=Math.min(lut.length-2,Math.floor(f)), d=f-i, a=lut[i], b=lut[i+1];
    return [Math.round(a[0]+(b[0]-a[0])*d),Math.round(a[1]+(b[1]-a[1])*d),Math.round(a[2]+(b[2]-a[2])*d)];
  }
  function magmaRgb(t){return lutRgb(LUT_MAGMA,t);}

  /* formatting & tick helpers */
  function fmtHz(v){v=Number(v)||0;return v>=1000?(v/1000).toFixed(v%1000===0||v>=10000?0:1).replace(/\.0$/,'')+' kHz':Math.round(v)+' Hz';}
  function fmtNum(v,step){
    const d=step>=1?0:Math.min(4,Math.ceil(-Math.log10(step)+1e-9));
    return Number(v).toFixed(d);
  }
  function niceStep(span,count){
    const raw=span/Math.max(1,count), mag=Math.pow(10,Math.floor(Math.log10(raw||1))), n=raw/mag;
    return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*mag;
  }
  /* returns {min,max,ticks,step} with max rounded up to a clean value */
  function niceScale(min,max,count=3){
    if(!(max>min))max=min+1;
    const step=niceStep(max-min,count);
    const lo=Math.floor(min/step+1e-9)*step, hi=Math.ceil(max/step-1e-9)*step;
    const ticks=[];for(let v=lo;v<=hi+step*1e-6;v+=step)ticks.push(+v.toFixed(10));
    return {min:lo,max:hi,ticks,step};
  }
  function percentile(arr,p){
    if(!arr||!arr.length)return 0;
    const a=Array.from(arr).filter(Number.isFinite).sort((x,y)=>x-y);
    return a.length?a[Math.min(a.length-1,Math.max(0,Math.round(p*(a.length-1))))]:0;
  }
  function smoothArr(arr,r){
    if(!arr||!arr.length||r<1)return arr;
    const N=arr.length, out=new Array(N);
    let s=0,c=0;
    for(let i=0;i<Math.min(N,r);i++){s+=arr[i];c++;}
    for(let i=0;i<N;i++){
      const add=i+r, rem=i-r-1;
      if(add<N){s+=arr[add];c++;}
      if(rem>=0){s-=arr[rem];c--;}
      out[i]=s/c;
    }
    return out;
  }
  function melRangeOf(sp){
    if(!sp||!sp.melDb||!sp.melDb.length)return [-60,0];
    if(sp._melRange)return sp._melRange;
    const flat=[];sp.melDb.forEach(r=>{for(let i=0;i<r.length;i+=3)flat.push(r[i]);});
    const lo=Math.max(-70,Math.min(-25,Math.floor(percentile(flat,0.10)/5)*5));
    sp._melRange=[lo,0];
    return sp._melRange;
  }
  function timeStep(dur,pw){
    const want=Math.max(3,Math.floor(pw/90));
    const steps=[1,2,5,10,15,20,30,60,90,120,180,300,600,900,1200,1800];
    for(const s of steps)if(dur/s<=want)return s;
    return 3600;
  }

  /* legend / row helpers (HTML) */
  function lgItem(color,label,value,dashed){
    return '<span class="lg"><i class="'+(dashed?'dash':'')+'" style="'+(dashed?'border-color:':'background:')+color+'"></i>'+esc(label)+(value!==undefined&&value!==null?' <b>'+esc(value)+'</b>':'')+'</span>';
  }
  function lgGrad(lut,lo,hi){
    const g=lut.map((c,i)=>'rgb('+c.join(',')+') '+Math.round(i/(lut.length-1)*100)+'%').join(',');
    return '<span class="lg">'+esc(lo)+'<i style="width:72px;height:8px;border-radius:2px;background:linear-gradient(90deg,'+g+')"></i>'+esc(hi)+'</span>';
  }
  function plotRow(title,sub,legend,id,h,extra){
    return '<div class="prow">'+
      '<div class="prow-head"><div><div class="prow-title">'+esc(title)+'</div><div class="prow-sub">'+esc(sub)+'</div></div>'+

      '<canvas id="'+id+'" class="pcanvas" height="'+h+'"></canvas>'+(extra||'')+
    '</div>';
  }

  function prepCanvas(id, keepBg=false){
    const cv=$(id);if(!cv)return null;
    const dpr=Math.min(3,window.devicePixelRatio||1);
    const w=cv.clientWidth||800, h=Number(cv.getAttribute('height'))||125;
    const rw=Math.round(w*dpr), rh=Math.round(h*dpr);
    const resized=(cv.width!==rw||cv.height!==rh);
    if(resized){
      cv.width=rw;cv.height=rh;cv.style.width='100%';cv.style.height=h+'px';
      cv._bgValid=false;
    }
    const ctx=cv.getContext('2d');
    ctx.setTransform(dpr,0,0,dpr,0,0);
    if(!keepBg||!cv._bgValid){
      ctx.clearRect(0,0,w,h);
    }
    return {ctx,w,h,dpr,cv,resized,pw:w-PLOT_PAD_L-PLOT_PAD_R,ph:h-PLOT_PAD_T-PLOT_PAD_B};
  }
  function saveCanvasBg(c){
    if(!c||!c.cv)return;
    const cv=c.cv;
    if(!cv._bgCanvas)cv._bgCanvas=document.createElement('canvas');
    if(cv._bgCanvas.width!==cv.width||cv._bgCanvas.height!==cv.height){
      cv._bgCanvas.width=cv.width;cv._bgCanvas.height=cv.height;
    }
    const bctx=cv._bgCanvas.getContext('2d');
    bctx.setTransform(1,0,0,1,0,0);
    bctx.clearRect(0,0,cv.width,cv.height);
    bctx.drawImage(cv,0,0);
    cv._bgValid=true;
  }
  function restoreCanvasBg(c){
    if(!c||!c.cv||!c.cv._bgCanvas||!c.cv._bgValid)return false;
    const {ctx,w,h,cv}=c;
    ctx.clearRect(0,0,w,h);
    ctx.drawImage(cv._bgCanvas,0,0,cv.width,cv.height,0,0,w,h);
    return true;
  }

  /*
   * spec may be a legacy array of evenly-spaced labels (top → bottom), or
   * { left:{ticks:[{f,label}]}, right:{ticks:[{f,label}], color}, grid:true|false }
   * where f is the 0..1 fraction from the bottom of the plot area.
   */
  function drawPlotAxes(ctx, w, h, spec){
    const pw=w-PLOT_PAD_L-PLOT_PAD_R, ph=h-PLOT_PAD_T-PLOT_PAD_B;
    const dur=S.dur||32;
    if(Array.isArray(spec)){
      const n=spec.length;
      spec={left:{ticks:spec.map((label,i)=>({f:1-i/Math.max(1,n-1),label}))}};
    }
    spec=spec||{};
    const yAt=f=>PLOT_PAD_T+(1-f)*ph;
    ctx.save();
    ctx.font=PLOT_FONT;
    ctx.textBaseline='middle';

    const lt=(spec.left&&spec.left.ticks)||[];
    let lastY=null;
    lt.slice().sort((a,b)=>b.f-a.f).forEach(t=>{
      const y=Math.round(yAt(t.f))+0.5;
      if(lastY!==null&&Math.abs(y-lastY)<13)return; /* avoid colliding labels */
      lastY=y;
      if(spec.grid!==false&&t.f>0.001){
        ctx.strokeStyle=GRID;ctx.lineWidth=1;
        ctx.beginPath();ctx.moveTo(PLOT_PAD_L,y);ctx.lineTo(PLOT_PAD_L+pw,y);ctx.stroke();
      }
      ctx.fillStyle=spec.left.color||AX_TXT;ctx.textAlign='right';
      ctx.fillText(t.label,PLOT_PAD_L-8,Math.min(PLOT_PAD_T+ph-4,Math.max(PLOT_PAD_T+5,y)));
    });
    const rt=(spec.right&&spec.right.ticks)||[];
    rt.forEach(t=>{
      const y=yAt(t.f);
      ctx.fillStyle=spec.right.color||AX_TXT;ctx.textAlign='left';
      ctx.fillText(t.label,PLOT_PAD_L+pw+8,Math.min(PLOT_PAD_T+ph-4,Math.max(PLOT_PAD_T+5,y)));
    });

    /* baseline + time ticks at clean intervals */
    const yb=Math.round(PLOT_PAD_T+ph)+0.5;
    ctx.strokeStyle=BASE;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(PLOT_PAD_L,yb);ctx.lineTo(PLOT_PAD_L+pw,yb);ctx.stroke();
    const step=timeStep(dur,pw);
    ctx.textBaseline='top';ctx.fillStyle=AX_TXT;
    for(let t=0;t<=dur+1e-6;t+=step){
      const x=Math.round(PLOT_PAD_L+(t/dur)*pw)+0.5;
      ctx.beginPath();ctx.moveTo(x,yb);ctx.lineTo(x,yb+4);ctx.stroke();
      const last=t+step>dur+1e-6;
      ctx.textAlign=t===0?'left':(last&&PLOT_PAD_L+pw-x<14)?'right':'center';
      ctx.fillText(fmt(t),x-(t===0?0.5:0),yb+7);
    }
    ctx.restore();
  }

  /* build a y-axis spec from a niceScale result */
  function axisFromScale(sc,fmtFn,color){
    return {ticks:sc.ticks.map(v=>({f:(v-sc.min)/Math.max(1e-12,sc.max-sc.min),label:fmtFn?fmtFn(v,sc.step):fmtNum(v,sc.step)})),color};
  }

  function drawSyncedOverlays(ctx, w, h, readoutFn){
    const pw=w-PLOT_PAD_L-PLOT_PAD_R, ph=h-PLOT_PAD_T-PLOT_PAD_B;
    const dur=S.dur||32;
    ctx.save();

    if(S.sel){
      const xA=PLOT_PAD_L+(S.sel.a/dur)*pw;
      const xB=PLOT_PAD_L+(S.sel.b/dur)*pw;
      ctx.fillStyle='rgba(142,197,184,0.09)';
      ctx.fillRect(xA,PLOT_PAD_T,Math.max(1,xB-xA),ph);
      ctx.strokeStyle='rgba(142,197,184,0.55)';
      ctx.lineWidth=1;
      ctx.beginPath();
      ctx.moveTo(Math.round(xA)+0.5,PLOT_PAD_T);ctx.lineTo(Math.round(xA)+0.5,PLOT_PAD_T+ph);
      ctx.moveTo(Math.round(xB)+0.5,PLOT_PAD_T);ctx.lineTo(Math.round(xB)+0.5,PLOT_PAD_T+ph);
      ctx.stroke();
    }

    if(S.t>0.05||S.playing){
      const xPh=Math.round(PLOT_PAD_L+Math.max(0,Math.min(1,S.t/dur))*pw)+0.5;
      ctx.strokeStyle='rgba(255,255,255,0.75)';
      ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(xPh,PLOT_PAD_T);ctx.lineTo(xPh,PLOT_PAD_T+ph);ctx.stroke();
    }

    const hovering=S.hoverT!==null&&S.hoverT!==undefined;
    if(hovering&&S.hoverT>=0&&S.hoverT<=dur){
      const xH=Math.round(PLOT_PAD_L+(S.hoverT/dur)*pw)+0.5;
      ctx.strokeStyle='rgba(255,255,255,0.32)';
      ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(xH,PLOT_PAD_T);ctx.lineTo(xH,PLOT_PAD_T+ph);ctx.stroke();
      const info=readoutFn?readoutFn(S.hoverT):null;
      if(info)drawTooltip(ctx,w,h,xH,info);
    }
    ctx.restore();
  }

  /* info: {text} (legacy single line) or {title, rows:[{label,value,color,y}]} where y is 0..1 marker position */
  function drawTooltip(ctx,w,h,x,info){
    const pw=w-PLOT_PAD_L-PLOT_PAD_R, ph=h-PLOT_PAD_T-PLOT_PAD_B;
    let title=info.title, rows=info.rows;
    if(!rows){
      const parts=String(info.text||'').split(' · ');
      title=parts.shift();rows=parts.map(p=>({label:p,value:''}));
    }
    (rows||[]).forEach(r=>{
      if(r.y===undefined||r.y===null||!r.color)return;
      const y=PLOT_PAD_T+(1-Math.max(0,Math.min(1,r.y)))*ph;
      ctx.beginPath();ctx.arc(x,y,3.2,0,Math.PI*2);
      ctx.fillStyle=r.color;ctx.fill();
      ctx.lineWidth=1.5;ctx.strokeStyle='#0E0E10';ctx.stroke();
    });
    ctx.font=PLOT_FONT;
    const lh=15, padX=9, padY=7;
    let lw=0,vw=0;
    rows.forEach(r=>{lw=Math.max(lw,ctx.measureText(r.label).width);vw=Math.max(vw,ctx.measureText(String(r.value)).width);});
    const tw=Math.max(ctx.measureText(title||'').width,(rows.some(r=>r.color)?12:0)+lw+(vw?14+vw:0))+padX*2;
    const th=padY*2+(title?lh:0)+rows.length*lh;
    let px=x+10;if(px+tw>PLOT_PAD_L+pw)px=x-10-tw;
    px=Math.max(2,px);
    const py=PLOT_PAD_T+4;
    ctx.fillStyle='rgba(24,24,28,0.96)';ctx.strokeStyle='rgba(255,255,255,0.10)';ctx.lineWidth=1;
    ctx.beginPath();
    if(ctx.roundRect)ctx.roundRect(px+0.5,py+0.5,tw,Math.min(th,h-py-2),6);else ctx.rect(px+0.5,py+0.5,tw,th);
    ctx.fill();ctx.stroke();
    ctx.textBaseline='middle';
    let cy=py+padY+lh/2;
    if(title){ctx.fillStyle='#8C8C93';ctx.textAlign='left';ctx.fillText(title,px+padX,cy);cy+=lh;}
    rows.forEach(r=>{
      let lx=px+padX;
      if(r.color){ctx.fillStyle=r.color;ctx.fillRect(lx,cy-1,8,2);lx+=12;}
      ctx.fillStyle='#A1A1A6';ctx.textAlign='left';ctx.fillText(r.label,lx,cy);
      if(r.value!==''){ctx.fillStyle='#ECECEF';ctx.textAlign='right';ctx.fillText(String(r.value),px+tw-padX,cy);}
      cy+=lh;
    });
  }

  function traceSeries(ctx, arr, pw, ph, minV, maxV, color, fillRgba=null, lw=1.5, dash=[]){
    if(!arr||!arr.length)return;
    const N=arr.length, span=Math.max(1e-12,maxV-minV);
    const xAt=i=>PLOT_PAD_L+(i/Math.max(1,N-1))*pw;
    const yAt=i=>PLOT_PAD_T+(1-Math.max(0,Math.min(1,((arr[i]||0)-minV)/span)))*ph;
    ctx.save();
    ctx.beginPath();ctx.rect(PLOT_PAD_L,PLOT_PAD_T-2,pw,ph+2);ctx.clip();
    ctx.lineJoin='round';ctx.lineCap='round';
    const path=()=>{ctx.beginPath();for(let i=0;i<N;i++){const x=xAt(i),y=yAt(i);i?ctx.lineTo(x,y):ctx.moveTo(x,y);}};
    if(fillRgba){
      path();
      ctx.lineTo(xAt(N-1),PLOT_PAD_T+ph);ctx.lineTo(xAt(0),PLOT_PAD_T+ph);ctx.closePath();
      const g=ctx.createLinearGradient(0,PLOT_PAD_T,0,PLOT_PAD_T+ph);
      g.addColorStop(0,fillRgba);g.addColorStop(1,fillRgba.replace(/[\d.]+\)\s*$/,'0)'));
      ctx.fillStyle=g;ctx.fill();
    }
    path();
    if(dash&&dash.length)ctx.setLineDash(dash);
    ctx.strokeStyle=color;ctx.lineWidth=Math.min(lw,1.8);
    ctx.stroke();
    ctx.restore();
  }

  /* opts.discrete: nearest-row sampling (for categorical rows like chroma / MFCC); opts.rowGap: px between rows */
  function drawHeatmapBilinear(c, mat, minV, maxV, colorFn, opts={}){
    const {ctx,dpr,pw,ph}=c;
    if(!mat||!mat.length)return;
    const rows=mat.length, cols=mat[0]?.length||1, span=Math.max(1e-6,maxV-minV);
    const imgW=Math.max(1,Math.round(pw*dpr)), imgH=Math.max(1,Math.round(ph*dpr));
    const img=ctx.createImageData(imgW,imgH);
    const data=img.data;
    const gap=(opts.rowGap||0)*dpr;
    for(let py=0;py<imgH;py++){
      let r0,r1,dr;
      if(opts.discrete){
        const rr=(1-(py+0.5)/imgH)*rows;
        r0=r1=Math.min(rows-1,Math.max(0,Math.floor(rr)));dr=0;
        const within=(rr-Math.floor(rr))*(imgH/rows);
        if(gap&&within<gap&&r0>0){ /* row separator */
          for(let px=0;px<imgW;px++){const idx=(py*imgW+px)*4;data[idx]=14;data[idx+1]=14;data[idx+2]=16;data[idx+3]=255;}
          continue;
        }
      }else{
        const rf=(1-py/Math.max(1,imgH-1))*(rows-1);
        r0=Math.floor(rf);r1=Math.min(rows-1,r0+1);dr=rf-r0;
      }
      const row0=mat[r0], row1=mat[r1];
      for(let px=0;px<imgW;px++){
        const cf=(px/Math.max(1,imgW-1))*(cols-1);
        const c0=Math.floor(cf), c1=Math.min(cols-1,c0+1), dc=cf-c0;
        const v=(row0[c0]*(1-dc)+row0[c1]*dc)*(1-dr)+(row1[c0]*(1-dc)+row1[c1]*dc)*dr;
        const rgb=colorFn((v-minV)/span,v);
        const idx=(py*imgW+px)*4;
        data[idx]=rgb[0];data[idx+1]=rgb[1];data[idx+2]=rgb[2];data[idx+3]=255;
      }
    }
    ctx.putImageData(img,Math.round(PLOT_PAD_L*dpr),Math.round(PLOT_PAD_T*dpr));
  }

  // 256-stop smooth Magma Palette for High-Definition Spectrogram
  // 256-stop smooth Magma Palette for High-Definition Spectrogram
  const MAGMA_256 = (()=>{
    const stops = [
      [0.00, [11, 7, 38]],
      [0.14, [40, 16, 74]],
      [0.28, [80, 18, 123]],
      [0.42, [130, 37, 129]],
      [0.57, [182, 54, 121]],
      [0.72, [235, 93, 80]],
      [0.86, [254, 175, 119]],
      [1.00, [252, 255, 164]]
    ];
    const out = [];
    for(let i=0; i<256; i++){
      const f = i / 255;
      let s0 = stops[0], s1 = stops[stops.length-1];
      for(let j=0; j<stops.length-1; j++){
        if(f >= stops[j][0] && f <= stops[j+1][0]){
          s0 = stops[j]; s1 = stops[j+1]; break;
        }
      }
      const t = (f - s0[0]) / Math.max(1e-6, s1[0] - s0[0]);
      const r = Math.round(s0[1][0] + (s1[1][0] - s0[1][0]) * t);
      const g = Math.round(s0[1][1] + (s1[1][1] - s0[1][1]) * t);
      const b = Math.round(s0[1][2] + (s1[1][2] - s0[1][2]) * t);
      out.push('rgb(' + r + ',' + g + ',' + b + ')');
    }
    return out;
  })();

  const DAW_PAD_L = 58;
  const DAW_PAD_R = 48;

  function updateDawPlayhead(){
    const ph = $('daw-playhead');
    const container = $('daw-container');
    if(!ph || !container) return;
    const dur = S.dur || 32;
    const w = container.clientWidth || 800;
    const pw = Math.max(1, w - DAW_PAD_L - DAW_PAD_R);
    const x = DAW_PAD_L + Math.max(0, Math.min(1, S.t / dur)) * pw;
    ph.style.transform = 'translateX(' + x + 'px)';
    ph.style.display = 'block';

    const durLbl = $('daw-dur-label');
    if(durLbl) durLbl.textContent = fmt(S.t) + ' / ' + fmt(dur);
    if($('tnow')) $('tnow').textContent = fmt(S.t);
  }

  function updateDawSelection(){
    const selEl = $('daw-selection');
    const container = $('daw-container');
    if(!selEl || !container) return;
    if(!S.sel){
      selEl.style.display = 'none';
      return;
    }
    const dur = S.dur || 32;
    const w = container.clientWidth || 800;
    const pw = Math.max(1, w - DAW_PAD_L - DAW_PAD_R);
    const xA = DAW_PAD_L + Math.max(0, Math.min(1, S.sel.a / dur)) * pw;
    const xB = DAW_PAD_L + Math.max(0, Math.min(1, S.sel.b / dur)) * pw;
    selEl.style.left = Math.min(xA, xB) + 'px';
    selEl.style.width = Math.max(2, Math.abs(xB - xA)) + 'px';
    selEl.style.display = 'block';
  }

  function updateDawHud(t){
    const ro = $('daw-hud-readout');
    const sp = S.data?.spectralPlots;
    if(!ro || !sp || !sp.curves) return;
    const dur = S.dur || 32;
    const nBins = sp.nBins || 400;
    const idx = Math.min(nBins - 1, Math.max(0, Math.floor((t / dur) * nBins)));
    const cv = sp.curves;
    const cent = Math.round(cv.centroidHz?.[idx] || 0);
    const ton = Math.round((cv.tonality?.[idx] || 0) * 100);
    const voc = ((cv.vocalRatio?.[idx] || 0) * 100).toFixed(1);
    const rms = (cv.rms?.[idx] || 0).toFixed(3);
    const flat = (cv.flatness?.[idx] || 0).toFixed(4);

    ro.innerHTML = '<span>Time <b>' + fmt(t) + '</b></span> · <span>Centroid <b style="color:#E2A86B">' + (cent >= 1000 ? (cent/1000).toFixed(2)+' kHz' : cent+' Hz') + '</b></span> · <span>Tonality <b style="color:#8EC5B8">' + ton + '%</b></span> · <span>Vocal <b style="color:#56B6C2">' + voc + '%</b></span> · <span>RMS <b style="color:#E2A86B">' + rms + '</b></span> · <span>Flatness <b style="color:#D97B88">' + flat + '</b></span>';
  }

  function bindDawContainer(){
    const container = $('daw-container');
    if(!container || container._bound) return;
    container._bound = true;

    let t0 = null, px0 = 0, drag = false;

    const tAt = e => {
      const dur = S.dur || 32;
      const r = container.getBoundingClientRect();
      const pw = Math.max(1, r.width - DAW_PAD_L - DAW_PAD_R);
      return Math.max(0, Math.min(dur, ((e.clientX - r.left - DAW_PAD_L) / pw) * dur));
    };

    container.addEventListener('pointerdown', e => {
      if(e.target.closest('.daw-pill')) return;
      t0 = tAt(e);
      px0 = e.clientX;
      drag = false;
      container.setPointerCapture(e.pointerId);
    });

    container.addEventListener('pointermove', e => {
      const dur = S.dur || 32;
      const t = tAt(e);
      S.hoverT = t;
      const r = container.getBoundingClientRect();
      const pw = Math.max(1, r.width - DAW_PAD_L - DAW_PAD_R);
      const xH = DAW_PAD_L + (t / dur) * pw;

      const hl = $('daw-hover-line');
      if(hl){
        hl.style.transform = 'translateX(' + xH + 'px)';
        hl.style.display = 'block';
      }

      updateDawHud(t);

      if(t0 !== null){
        if(!drag && Math.abs(e.clientX - px0) > 4) drag = true;
        if(drag){
          S.sel = { a: Math.min(t0, t), b: Math.max(t0, t) };
          updateDawSelection();
          drawWave();
        }
      }
    });

    container.addEventListener('pointerleave', () => {
      if(t0 === null){
        S.hoverT = null;
        const hl = $('daw-hover-line');
        if(hl) hl.style.display = 'none';
        const ro = $('daw-hud-readout');
        if(ro) ro.textContent = 'Hover or drag across any lane to inspect & audition in sync';
      }
    });

    container.addEventListener('pointerup', async e => {
      if(t0 === null) return;
      const dur = S.dur || 32;
      const t = tAt(e);
      const wasDrag = drag;
      t0 = null;
      drag = false;
      if(!wasDrag){
        seekTo(t, (S.sel && t >= S.sel.a && t <= S.sel.b) ? S.sel.b : null);
        drawWave();
        updateDawPlayhead();
      } else {
        if(S.sel && S.sel.b - S.sel.a < 1.0){
          S.sel.b = Math.min(dur, S.sel.a + 4.0);
        }
        updateDawSelection();
        drawWave();
        if(S.sel){
          seekTo(S.sel.a, S.sel.b);
          try{await audio.play(); S.playing=true;}catch(err){}
          await inspectSelection();
          render();
        }
      }
    });
  }

  function drawMelCanvas(cv, sp, dur, w, h){
    if(!cv || !sp || !sp.melDb || !sp.melDb.length) return;
    const dpr = Math.min(3, window.devicePixelRatio || 1);
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(h * dpr);
    cv.style.width = '100%';
    cv.style.height = h + 'px';
    const ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const PAD_T = 6, PAD_B = 8;
    const pw = w - DAW_PAD_L - DAW_PAD_R, ph = h - PAD_T - PAD_B;

    ctx.fillStyle = '#0B0B0D';
    ctx.fillRect(DAW_PAD_L, PAD_T, pw, ph);

    const rows = sp.melDb.length;
    const cols = sp.melDb[0].length;
    const cw = pw / cols;
    const ch = ph / rows;
    const [loDb, hiDb] = melRangeOf(sp);
    const dbSpan = Math.max(10, hiDb - loDb);

    for(let r = 0; r < rows; r++){
      const rowArr = sp.melDb[rows - 1 - r];
      const y = PAD_T + r * ch;
      for(let col = 0; col < cols; col++){
        const db = rowArr[col];
        const norm = Math.max(0, Math.min(1, (db - loDb) / dbSpan));
        const colorIdx = Math.floor(norm * 255);
        ctx.fillStyle = MAGMA_256[colorIdx];
        ctx.fillRect(DAW_PAD_L + col * cw, y, cw + 0.45, ch + 0.45);
      }
    }

    ctx.font = '10px var(--sans)';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#85858B';

    const nyq = (sp.melFreqsHz && sp.melFreqsHz.length) ? sp.melFreqsHz[sp.melFreqsHz.length - 1] : 5512;
    const fTicks = [
      { f: 0.94, lbl: fmtHz(nyq) },
      { f: 0.65, lbl: '2 kHz' },
      { f: 0.36, lbl: '500 Hz' },
      { f: 0.08, lbl: '55 Hz' }
    ];
    fTicks.forEach(t => {
      const y = PAD_T + (1 - t.f) * ph;
      ctx.fillText(t.lbl, DAW_PAD_L - 8, y);
      ctx.strokeStyle = 'rgba(255,255,255,0.06)';
      ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(DAW_PAD_L, y); ctx.lineTo(DAW_PAD_L + pw, y); ctx.stroke();
    });

    const cvCurves = sp.curves;
    if(cvCurves){
      if(cvCurves.rolloffHz && cvCurves.rolloffHz.length){
        ctx.save();
        ctx.strokeStyle = '#8EC5B8';
        ctx.lineWidth = 1.4;
        ctx.setLineDash([4, 3]);
        ctx.beginPath();
        for(let i = 0; i < cols; i++){
          const hz = cvCurves.rolloffHz[i] || 0;
          const fNorm = Math.max(0, Math.min(1, hz / nyq));
          const x = DAW_PAD_L + (i / (cols - 1)) * pw;
          const y = PAD_T + (1 - fNorm) * ph;
          if(i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();
        ctx.restore();
      }

      if(cvCurves.centroidHz && cvCurves.centroidHz.length){
        ctx.save();
        ctx.shadowColor = 'rgba(226,168,107,0.45)';
        ctx.shadowBlur = 4;
        ctx.strokeStyle = '#E2A86B';
        ctx.lineWidth = 1.9;
        ctx.beginPath();
        for(let i = 0; i < cols; i++){
          const hz = cvCurves.centroidHz[i] || 0;
          const fNorm = Math.max(0, Math.min(1, hz / nyq));
          const x = DAW_PAD_L + (i / (cols - 1)) * pw;
          const y = PAD_T + (1 - fNorm) * ph;
          if(i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();
        ctx.restore();
      }
    }
  }

  function drawTrajectoriesD3(svgEl, sp, dur, w, h){
    if(typeof d3 === 'undefined' || !svgEl || !sp || !sp.curves) return;
    const svg = d3.select(svgEl);
    svg.selectAll('*').remove();
    svg.attr('width', w).attr('height', h).attr('viewBox', '0 0 ' + w + ' ' + h);

    const PAD_T = 10, PAD_B = 16;
    const pw = w - DAW_PAD_L - DAW_PAD_R, ph = h - PAD_T - PAD_B;
    const cv = sp.curves;
    const nBins = sp.nBins || 400;
    const times = sp.times || Array.from({length: nBins}, (_, i) => (i / Math.max(1, nBins - 1)) * dur);

    const defs = svg.append('defs');
    const gradTon = defs.append('linearGradient').attr('id', 'grad-ton').attr('x1', 0).attr('y1', 0).attr('x2', 0).attr('y2', 1);
    gradTon.append('stop').attr('offset', '0%').attr('stop-color', '#8EC5B8').attr('stop-opacity', 0.22);
    gradTon.append('stop').attr('offset', '100%').attr('stop-color', '#8EC5B8').attr('stop-opacity', 0.01);

    const gradRms = defs.append('linearGradient').attr('id', 'grad-rms').attr('x1', 0).attr('y1', 0).attr('x2', 0).attr('y2', 1);
    gradRms.append('stop').attr('offset', '0%').attr('stop-color', '#E2A86B').attr('stop-opacity', 0.20);
    gradRms.append('stop').attr('offset', '100%').attr('stop-color', '#E2A86B').attr('stop-opacity', 0.01);

    const xScale = d3.scaleLinear().domain([0, dur]).range([DAW_PAD_L, DAW_PAD_L + pw]);
    const yScalePct = d3.scaleLinear().domain([0, 1]).range([PAD_T + ph, PAD_T]);
    const maxFlat = Math.max(0.08, (d3.max(cv.flatness || [0.08]) || 0.08) * 1.25);
    const yScaleFlat = d3.scaleLinear().domain([0, maxFlat]).range([PAD_T + ph, PAD_T]);
    const maxRms = Math.max(0.02, (d3.max(cv.rms || [0.02]) || 0.02) * 1.15);
    const yScaleRms = d3.scaleLinear().domain([0, maxRms]).range([PAD_T + ph, PAD_T]);

    const gridG = svg.append('g').attr('class', 'daw-grid');
    [0.25, 0.50, 0.75, 1.0].forEach(f => {
      const y = yScalePct(f);
      gridG.append('line')
        .attr('x1', DAW_PAD_L).attr('y1', y).attr('x2', DAW_PAD_L + pw).attr('y2', y)
        .attr('stroke', 'rgba(255,255,255,0.05)').attr('stroke-width', 1);
    });

    const axLeft = svg.append('g').attr('class', 'daw-axis-left');
    ['100%', '50%', '0%'].forEach((lbl, i) => {
      const f = 1 - i * 0.5;
      axLeft.append('text')
        .attr('x', DAW_PAD_L - 8).attr('y', yScalePct(f) + 3.5)
        .attr('text-anchor', 'end')
        .attr('fill', '#85858B').attr('font-size', '10px')
        .attr('font-family', 'var(--sans)')
        .text(lbl);
    });

    const axRight = svg.append('g').attr('class', 'daw-axis-right');
    [maxFlat, maxFlat * 0.5, 0].forEach((v, i) => {
      axRight.append('text')
        .attr('x', DAW_PAD_L + pw + 6).attr('y', yScaleFlat(v) + 3.5)
        .attr('text-anchor', 'start')
        .attr('fill', '#85858B').attr('font-size', '10px')
        .attr('font-family', 'var(--sans)')
        .text(v.toFixed(3));
    });

    const lineGen = (data, ySc) => d3.line()
      .x((d, i) => xScale(times[i] || 0))
      .y(d => ySc(d))
      .curve(d3.curveMonotoneX)(data);

    const areaGen = (data, ySc) => d3.area()
      .x((d, i) => xScale(times[i] || 0))
      .y0(PAD_T + ph)
      .y1(d => ySc(d))
      .curve(d3.curveMonotoneX)(data);

    if(cv.rms && cv.rms.length){
      svg.append('path').attr('d', areaGen(cv.rms, yScaleRms)).attr('fill', 'url(#grad-rms)');
      svg.append('path').attr('d', lineGen(cv.rms, yScaleRms))
        .attr('fill', 'none').attr('stroke', '#E2A86B').attr('stroke-width', 1.8);
    }

    if(cv.tonality && cv.tonality.length){
      svg.append('path').attr('d', areaGen(cv.tonality, yScalePct)).attr('fill', 'url(#grad-ton)');
      svg.append('path').attr('d', lineGen(cv.tonality, yScalePct))
        .attr('fill', 'none').attr('stroke', '#8EC5B8').attr('stroke-width', 1.8);
    }

    if(cv.vocalRatio && cv.vocalRatio.length){
      svg.append('path').attr('d', lineGen(cv.vocalRatio, yScalePct))
        .attr('fill', 'none').attr('stroke', '#56B6C2').attr('stroke-width', 1.5);
    }

    if(cv.flatness && cv.flatness.length){
      svg.append('path').attr('d', lineGen(cv.flatness, yScaleFlat))
        .attr('fill', 'none').attr('stroke', '#D97B88').attr('stroke-width', 1.4);
    }

    if(cv.zcr && cv.zcr.length){
      const maxZcr = Math.max(0.12, (d3.max(cv.zcr) || 0.12) * 1.2);
      const yScZcr = d3.scaleLinear().domain([0, maxZcr]).range([PAD_T + ph, PAD_T]);
      svg.append('path').attr('d', lineGen(cv.zcr, yScZcr))
        .attr('fill', 'none').attr('stroke', '#829CD0').attr('stroke-width', 1.2)
        .attr('stroke-dasharray', '4, 3');
    }
  }

  function drawChromaCanvas(cv, sp, dur, w, h){
    if(!cv || !sp || !sp.chroma || !sp.chroma.length) return;
    const dpr = Math.min(3, window.devicePixelRatio || 1);
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(h * dpr);
    cv.style.width = '100%';
    cv.style.height = h + 'px';
    const ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const PAD_T = 6, PAD_B = 6;
    const pw = w - DAW_PAD_L - DAW_PAD_R, ph = h - PAD_T - PAD_B;

    ctx.fillStyle = '#0B0B0D';
    ctx.fillRect(DAW_PAD_L, PAD_T, pw, ph);

    const rows = 12;
    const cols = sp.chroma[0].length;
    const cw = pw / cols;
    const ch = ph / rows;
    const noteNames = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];

    for(let r = 0; r < rows; r++){
      const noteIdx = rows - 1 - r;
      const rowArr = sp.chroma[noteIdx];
      const y = PAD_T + r * ch;

      ctx.fillStyle = '#A1A1A6';
      ctx.font = '9.5px var(--sans)';
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      ctx.fillText(noteNames[noteIdx], DAW_PAD_L - 8, y + ch / 2);

      ctx.strokeStyle = 'rgba(255,255,255,0.04)';
      ctx.lineWidth = 0.5;
      ctx.beginPath(); ctx.moveTo(DAW_PAD_L, y); ctx.lineTo(DAW_PAD_L + pw, y); ctx.stroke();

      for(let col = 0; col < cols; col++){
        const v = Math.max(0, Math.min(1, rowArr[col] || 0));
        const alpha = (0.04 + 0.92 * Math.pow(v, 1.2)).toFixed(3);
        ctx.fillStyle = 'rgba(142,197,184,' + alpha + ')';
        ctx.fillRect(DAW_PAD_L + col * cw, y, cw + 0.45, ch - 0.5);
      }
    }
  }

  function drawMfccCanvas(cv, sp, dur, w, h){
    if(!cv || !sp || !sp.mfcc || !sp.mfcc.length) return;
    const dpr = Math.min(3, window.devicePixelRatio || 1);
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(h * dpr);
    cv.style.width = '100%';
    cv.style.height = h + 'px';
    const ctx = cv.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const PAD_T = 6, PAD_B = 6;
    const pw = w - DAW_PAD_L - DAW_PAD_R, ph = h - PAD_T - PAD_B;

    ctx.fillStyle = '#0B0B0D';
    ctx.fillRect(DAW_PAD_L, PAD_T, pw, ph);

    const rows = 8;
    const cols = sp.mfcc[0].length;
    const cw = pw / cols;
    const ch = ph / rows;

    for(let r = 0; r < rows; r++){
      const cIdx = rows - 1 - r;
      const rowArr = sp.mfcc[cIdx];
      const y = PAD_T + r * ch;

      ctx.fillStyle = '#A1A1A6';
      ctx.font = '10px var(--sans)';
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      ctx.fillText('c' + (cIdx + 1), DAW_PAD_L - 8, y + ch / 2);

      ctx.strokeStyle = 'rgba(255,255,255,0.04)';
      ctx.lineWidth = 0.5;
      ctx.beginPath(); ctx.moveTo(DAW_PAD_L, y); ctx.lineTo(DAW_PAD_L + pw, y); ctx.stroke();

      for(let col = 0; col < cols; col++){
        const z = Math.max(-2.5, Math.min(2.5, rowArr[col] || 0));
        let fill = '#151518';
        if(z > 0){
          const a = (0.05 + 0.9 * Math.pow(z / 2.5, 1.1)).toFixed(3);
          fill = 'rgba(217,123,136,' + a + ')';
        } else if(z < 0){
          const a = (0.05 + 0.9 * Math.pow(-z / 2.5, 1.1)).toFixed(3);
          fill = 'rgba(74,123,176,' + a + ')';
        }
        ctx.fillStyle = fill;
        ctx.fillRect(DAW_PAD_L + col * cw, y, cw + 0.45, ch - 0.5);
      }
    }
  }

  function drawRulerD3(svgEl, dur, w){
    if(typeof d3 === 'undefined' || !svgEl) return;
    const svg = d3.select(svgEl);
    svg.selectAll('*').remove();
    svg.attr('width', w).attr('height', 26).attr('viewBox', '0 0 ' + w + ' ' + hRuler(26));
    function hRuler(v){return v;}

    const pw = w - DAW_PAD_L - DAW_PAD_R;
    const xScale = d3.scaleLinear().domain([0, dur]).range([DAW_PAD_L, DAW_PAD_L + pw]);

    const steps = [1, 2, 5, 10, 15, 30, 60, 120, 180, 300, 600];
    const wantTicks = Math.max(4, Math.floor(pw / 90));
    const step = steps.find(s => dur / s <= wantTicks) || 60;

    svg.append('line')
      .attr('x1', DAW_PAD_L).attr('y1', 0.5)
      .attr('x2', DAW_PAD_L + pw).attr('y2', 0.5)
      .attr('stroke', '#2C2C31').attr('stroke-width', 1);

    for(let t = 0; t <= dur + 1e-6; t += step){
      const x = Math.round(xScale(t)) + 0.5;
      svg.append('line')
        .attr('x1', x).attr('y1', 0)
        .attr('x2', x).attr('y2', 5)
        .attr('stroke', '#45454B').attr('stroke-width', 1);

      svg.append('text')
        .attr('x', x).attr('y', 17)
        .attr('text-anchor', t === 0 ? 'start' : (DAW_PAD_L + pw - x < 20 ? 'end' : 'middle'))
        .attr('fill', '#85858B').attr('font-size', '10px')
        .attr('font-family', 'var(--sans)')
        .text(fmt(t));
    }

    const minorStep = step / 2;
    if(minorStep >= 1){
      for(let t = minorStep; t < dur; t += step){
        const x = Math.round(xScale(t)) + 0.5;
        svg.append('line')
          .attr('x1', x).attr('y1', 0)
          .attr('x2', x).attr('y2', 3)
          .attr('stroke', 'rgba(255,255,255,0.12)').attr('stroke-width', 1);
      }
    }
  }

  function drawSpectralCanvases(){
