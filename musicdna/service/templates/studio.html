  function bindTimeCanvasesByIds(ids, redrawFn){
    ids.forEach(id=>{
      const cv=$(id);if(!cv||cv._bound)return;
      cv._bound=true;
      let x0=null,px0=0,drag=false;
      const tAt=e=>{
        const r=cv.getBoundingClientRect();
        const pw=Math.max(1,r.width-PLOT_PAD_L-PLOT_PAD_R);
        const rel=(e.clientX-r.left-PLOT_PAD_L)/pw;
        return Math.max(0,Math.min(S.dur,rel*S.dur));
      };
      cv.onpointerdown=e=>{x0=tAt(e);px0=e.clientX;drag=false;cv.setPointerCapture(e.pointerId);};
      cv.onpointermove=e=>{
        const t=tAt(e);
        S.hoverT=t;
        const sp=S.data?.spectralPlots;
        if(sp&&$('hover-readout')){
          const idx=Math.min(sp.nBins-1,Math.max(0,Math.floor(t/S.dur*sp.nBins)));
          $('hover-readout').textContent=fmt(t)+' · Flatness '+Number(sp.curves.flatness[idx]||0).toFixed(4)+' (Tonality '+Math.round((sp.curves.tonality[idx]||0)*100)+'%) · Centroid '+Math.round(sp.curves.centroidHz[idx]||0)+' Hz · Vocal '+Math.round((sp.curves.vocalRatio[idx]||0)*100)+'% · RMS '+Number(sp.curves.rms[idx]||0).toFixed(4);
        }
        if(x0===null){redrawFn(true);return;}
        if(!drag&&Math.abs(e.clientX-px0)>5)drag=true;
        if(drag){S.sel={a:Math.min(x0,t),b:Math.max(x0,t)};if(S.view==='waveform')drawWave();redrawFn(true);}
      };
      cv.onpointerleave=()=>{
        if(x0===null){S.hoverT=null;redrawFn(true);}
      };
      cv.onpointerup=async e=>{
        if(x0===null)return;
        const t=tAt(e);
        if(!drag){
          seekTo(t,(S.sel&&t>=S.sel.a&&t<=S.sel.b)?S.sel.b:null);
          if(S.view==='waveform')drawWave();
          redrawFn(true);
        }else{
          if(S.sel.b-S.sel.a<Math.min(3,S.dur*0.05))S.sel.b=Math.min(S.dur,S.sel.a+Math.min(3,S.dur*0.05));
          seekTo(S.sel.a,S.sel.b);
          try{await audio.play();S.playing=true;}catch(err){}
          await inspectSelection();
          render();
        }
        x0=null;
      };
    });
  }

  function bindSpectralCanvases(){
    bindTimeCanvasesByIds(['cv-mel','cv-flatness','cv-centroid','cv-vocal','cv-rms','cv-flux','cv-chroma','cv-mfcc'], drawSpectralCanvases);
  }

  /* ---------- View 2: Big Unified M3 Acoustic DNA Ring + Russell Circumplex Core ---------- */
  function renderRingView(){
    const segs=S.data?.multimodal?.segments||[];
    const vaList=S.data?.dynamicVA||[];
    const trackDims=S.data?.musicalDimensions||S.data?.multimodal?.musicalDimensions||{};
    const ps=getPassageStats();
    const inSel=segs.filter(s=>S.sel&&Math.max(S.sel.a,s.startSec)<Math.min(S.sel.b,s.endSec));
    const activeSegs=inSel.length?inSel:segs;
    const cl=(v,lo=0,hi=1)=>Math.max(lo,Math.min(hi,Number(v)||0));
    // FIX: every helper below returns null (not 0 or a made-up default) when nothing was measured.
    // The display layer turns null into "—" with the tooltip NM_TIP.
    // Example: a track with no vocal pitch used to show "Pitch Vibrato 58%"; it now shows "—".
    const NM='—', NM_TIP='Not measured for this track';
    const isNum=v=>v!==undefined&&v!==null&&v!==''&&typeof v!=='boolean'&&Number.isFinite(Number(v));
    const meanOf=arr=>{const v=arr.filter(isNum).map(Number);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;};
    const pctText=v=>v===null?NM:Math.round(v*100)+'%';
    const nmTitle=v=>v===null?' title="'+NM_TIP+'"':'';
    // FIX: avgDesc used `||0`, so a missing descriptor averaged in as 0 (e.g. "Vocal 0%").
    // Now missing descriptors are skipped; no values at all gives null -> "—".
    const avgDesc=k=>meanOf(activeSegs.map(s=>s.descriptors?.[k]));
    const avgAllDesc=k=>meanOf(segs.map(s=>s.descriptors?.[k]));
    // FIX: the page read `s.musicalDimensions`, but the backend sends per-window dimensions at
    // `s.descriptors.dimensions` (features/structure.py analyze_dimensions). Example: tempo was
    // always the 116 BPM fallback because the per-window value was never found.
    const winDims=s=>s?.descriptors?.dimensions||null;
    // FIX: avgDim/avgAllDim took a hard-coded fallback `fb` (0.58, 0.66, 116 ...) when no value existed.
    // Example: every track without vocals showed "Expressive Dyn. 66%". Now they return null -> "—".
    // avgDim = selected passage only. avgAllDim = all windows, then the track summary.
    const avgDim=(fam,k)=>meanOf(activeSegs.map(s=>winDims(s)?.[fam]?.[k]));
    const avgAllDim=(fam,k)=>{
      const v=meanOf(segs.map(s=>winDims(s)?.[fam]?.[k]));
      return v!==null?v:(isNum(trackDims?.[fam]?.[k])?Number(trackDims[fam][k]):null);
    };
    // Vocal pitch descriptors (vocalsExpression.pitch) are null unless a real vocal stem was tracked.
    const avgPitch=k=>meanOf(activeSegs.map(s=>winDims(s)?.vocalsExpression?.pitch?.[k]));
    const avgAllPitch=k=>{
      const v=meanOf(segs.map(s=>winDims(s)?.vocalsExpression?.pitch?.[k]));
      return v!==null?v:(isNum(trackDims?.vocalsExpression?.pitch?.[k])?Number(trackDims.vocalsExpression.pitch[k]):null);
    };
    // Passage stats from the spectral curves; null when the curve was not sent.
    // FIX: Tonality fell back to `1 - flatness*2` and Rolloff to `brightness*1.85` (invented formulas).
    // Example: with no rolloff curve the page showed "Spectral Rolloff 2775 Hz" from a 1500 Hz centroid.
    const curves=S.data?.spectralPlots?.curves||{};
    const psv=(k,curve)=>ps&&Array.isArray(curves[curve])&&curves[curve].length?ps[k]:null;

    // Key & Chords from Melody & Harmony dimension
    // FIX: key fell back to 'C Major' and chords to ['C','Am','F','G'] when nothing was detected.
    // Example: a track with no harmony analysis was labelled "C Major · C → Am → F → G". Now "—".
    const firstDimSeg=activeSegs.find(s=>winDims(s)?.melodyHarmony)||null;
    const mh=winDims(firstDimSeg)?.melodyHarmony||trackDims.melodyHarmony||{};
    const detectedKey=mh.key||trackDims.melodyHarmony?.key||null;
    const keyText=detectedKey||NM;
    const chordList=(mh.chords&&mh.chords.length?mh.chords:(trackDims.melodyHarmony?.chords||[])).slice(0,4);
    const chordText=chordList.length?chordList.join(' → '):NM;
    // FIX: tempo/syncopation/pulse used 116 / 0.38 / 0.68 fallbacks. beatStrength is not sent by the
    // backend at all and was faked as onset_activity*0.65. Example: "116 BPM" on every unanalysed track.
    const tempoRaw=avgDim('rhythmGroove','tempoBpm');
    const tempoBpm=tempoRaw===null?null:Math.round(tempoRaw);
    const tempoText=tempoBpm===null?NM+' BPM':tempoBpm+' BPM';
    const syncopation=avgDim('rhythmGroove','syncopation');
    const pulseClarity=avgDim('rhythmGroove','pulseClarity');

    // 12-pitch chroma profile
    // FIX: missing chroma fell back to 0.3 per pitch class. Example: an empty profile showed
    // "Chroma Peak (C) 100%". Now: spectral chroma, else window chroma, else track chroma, else null.
    const descChroma=arr=>{const c=arr.map(s=>s.descriptors?.chroma).filter(c=>Array.isArray(c)&&c.length===12);
      return c.length?NOTES.map((_,i)=>meanOf(c.map(x=>x[i]))):null;};
    const hasSpecChroma=Array.isArray(S.data?.spectralPlots?.chroma)&&S.data.spectralPlots.chroma.length===12;
    const trackChroma=Array.isArray(trackDims.melodyHarmony?.chroma)&&trackDims.melodyHarmony.chroma.length===12?trackDims.melodyHarmony.chroma.map(Number):null;
    const chromaSel=(hasSpecChroma&&ps?ps.chromaSel:null)||descChroma(activeSegs)||trackChroma;
    const chromaAll=(hasSpecChroma&&ps?ps.chromaAll:null)||descChroma(segs)||trackChroma;
    const maxChroma=chromaSel?Math.max(0.01,...chromaSel,...(chromaAll||[])):null;
    const domPitchIdx=chromaSel?chromaSel.indexOf(Math.max(...chromaSel)):-1;

    // 8-Instrument probabilities
    // FIX: read `instrumentProbabilities` (the backend key is `probabilities`) and fell back to 0.22.
    // Example: every instrument showed "22%" for every track. Now measured values or "—".
    const instKeys=['vocals','piano','guitar','strings','drums','bass','synthesizer','brass'];
    const instProbs=instKeys.map(k=>{
      let v=meanOf(activeSegs.map(s=>winDims(s)?.instrumentationTimbre?.probabilities?.[k]));
      if(v===null&&isNum(trackDims.instrumentationTimbre?.probabilities?.[k]))v=Number(trackDims.instrumentationTimbre.probabilities[k]);
      return {key:k,label:k.charAt(0).toUpperCase()+k.slice(1),val:v===null?null:cl(v)};
    }).sort((a,b)=>(b.val??-1)-(a.val??-1));

    // 4-Stem energies
    // FIX: missing stem energies fell back to 0.25 each. Example: "Vocals 25% · Drums 25% ..." for
    // every track. Now the share is computed only from measured stem RMS, otherwise "—".
    const stemKeys=[['vocals','Vocals','#D97B88'],['drums','Drums','#E2A86B'],['bass','Bass','#829CD0'],['other','Harmonic / Other','#8EC5B8']];
    const stems=stemKeys.map(([k,lbl,col])=>{
      let v=meanOf(activeSegs.map(s=>winDims(s)?.arrangementTransitions?.stemEnergies?.[k]));
      if(v===null&&isNum(trackDims.arrangementTransitions?.stemEnergies?.[k]))v=Number(trackDims.arrangementTransitions.stemEnergies[k]);
      return {key:k,label:lbl,color:col,val:v};
    });
    const stemSum=stems.reduce((a,s)=>a+(s.val||0),0);
    stems.forEach(s=>{s.pct=(s.val===null||stemSum<=0)?null:Math.round(s.val/stemSum*100);});

    const layering=avgDim('arrangementTransitions','layeringDensity');
    const activeStemNames=[...new Set(activeSegs.flatMap(s=>winDims(s)?.arrangementTransitions?.activeStems||[]))];
    const fmtPct=v=>pctText(v);
    const fmtHzV=v=>v===null?NM:Math.round(v)+' Hz';
    const fmtFix=d=>v=>v===null?NM:Number(v).toFixed(d);
    const vocalPres=avgDesc('vocal_presence');
    const vibExtent=avgPitch('vibrato_extent_st');
    const vibRate=avgPitch('vibrato_rate_hz');

    // 5 Acoustic DNA Genomic Families aligned with the original Music DNA design system
    // FIX: each `pct` had an `||<number>` default (76, 64, 58, 48, 54) and features had invented
    // fallbacks or scale factors (e.g. vocal_presence*1.28). Example: an unanalysed track showed
    // "Vocal Expression 76%". `pct` is now one measured value (0..1 -> %) or null -> "—".
    // Feature `val`/`avg` are raw measured values; `fmt` formats both (null -> "—").
    const families=[
      {
        id:0, name:'Vocal Expression', short:'vocal presence', sub:'dominant expressive lead',
        // pct = DSP vocal-band presence of the passage (was presence*1.28, clamped, ||76).
        pct:vocalPres===null?null:Math.round(cl(vocalPres)*100),
        n:12,
        desc:'Prominent 300–3400 Hz vocal presence, pitch contour modulation, vibrato, and breath warmth',
        // FIX: "Vibrato" read vocalsExpression.vocalPitchVariation (never sent) with fallback 0.58 -> "58%".
        // It now shows the measured vibrato extent in semitones, e.g. "Vibrato 0.42 st", or "—".
        raw:'Vocal '+pctText(vocalPres)+' · Vibrato '+(vibExtent===null?NM:vibExtent.toFixed(2)+' st'),
        features:[
          {label:'Vocal Presence',val:vocalPres,avg:avgAllDesc('vocal_presence'),fmt:fmtPct},
          {label:'Expressive Dyn.',val:avgDim('vocalsExpression','expressiveDynamic'),avg:avgAllDim('vocalsExpression','expressiveDynamic'),fmt:fmtPct},
          // FIX: was vocalPitchVariation (never sent) shown as "58%". Now pitch.vibrato_extent_st in
          // semitones, rate (vibrato_rate_hz) in the label, e.g. "Pitch Vibrato (5.1 Hz) 0.42 st". "—" when no pitch.

      {
        id:4, name:'Arrangement & Stems', short:'source balance', sub:'harmonic + vocal foundation',
        // FIX: pct read arrangementTransitions.harmonicRatio (never sent, fallback 0.64, ||54).
        // Now the measured layering density (share of stems active), e.g. "75%", or "—".
        pct:layering===null?null:Math.round(cl(layering)*100),
        n:8,
        desc:'HPSS harmonic/percussive split, 4-stem energy balance, dynamic energy, and novelty',
        // FIX: was "Harmonic 64% · Percussive 38%" from never-sent keys. Now layering + active stems.
        raw:'Layering '+pctText(layering)+' · Active stems: '+(activeStemNames.length?activeStemNames.join(', '):NM),
        features:[
          // FIX: harmonicRatio / percussiveRatio / noveltyScore are never sent (fallbacks 0.64/0.38/0.52). Now "—".
          {label:'Harmonic Stem',val:null,avg:null,fmt:fmtPct},
          {label:'Percussive Stem',val:null,avg:null,fmt:fmtPct},

    families.forEach(f=>{f.pctText=f.pct===null?NM:f.pct+'%';});

                // FIX: avg was printed as Math.round(avg*100)+'%' of a scaled value, e.g. "76% (avg 95%)"

          activeSegs.slice(0,8).map(s=>{

            const wTempo=isNum(wd?.rhythmGroove?.tempoBpm)?wd.rhythmGroove.tempoBpm:s.descriptors?.tempoBpm;

            const sgn=v=>isNum(v)?(v>=0?'+':'')+Number(v).toFixed(2):NM;

            return '<div class="evr"><button class="cplay" style="width:32px;height:32px" data-act="play-win" data-v="'+si+'">'+svg('i-play',11)+'</button>'+
              '<span class="x">Window '+(si+1)+' <span>— '+fmt(s.startSec)+' to '+fmt(s.endSec)+' · '+esc(wKey)+' · '+wBpm+'</span></span>'+
              '<span style="font-size:12.5px;color:var(--sub)">Valence '+sgn(wva?.valence)+' · Arousal '+sgn(wva?.arousal)+' · Vocal '+(isNum(wVoc)?Math.round(wVoc*100)+'%':NM)+'</span></div>';

        '<div class="tans"><span class="cnote"'+nmTitle(fam.pct)+'>'+fam.pctText+' activation</span></div>'+
        detail+

    }).join('');

    $('main').innerHTML='<div class="col pcol">'+
      '<div class="dtop">'+
        '<div>'+
          '<div style="font-size:12px;letter-spacing:.08em;color:var(--mute);margin-bottom:4px">ACOUSTIC DNA &amp; RUSSELL CLASSIFICATION SPACE</div>'+
          '<h1 class="ph1">My Music DNA</h1>'+

          '<!-- Inner Emotion Circumplex Core -->'+

            '<div class="axis-h"></div>'+

          '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">'+

          '<div>'+
            instProbs.map((inst,idx)=>
              '<div class="dna-inst-row">'+

          '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">'+
            '<span style="font-size:13px;font-weight:500;color:var(--fg)">4-Stem Energy Balance</span>'+
            '<span style="font-size:11px;color:var(--mute)">HPSS Separation</span>'+
          '</div>'+
          '<div style="height:8px;border-radius:4px;overflow:hidden;display:flex;background:#1C1C21;margin-bottom:12px">'+
            stems.map((s,si)=>'<div style="width:'+(s.pct||0)+'%;background:var(--accent);opacity:'+(si===0?1:si===1?0.75:si===2?0.5:0.3)+'" title="'+esc(s.label)+': '+(s.pct===null?NM_TIP:s.pct+'%')+'"></div>').join('')+
          '</div>'+
          '<div class="dna-stem-grid">'+
            stems.map((s,si)=>
              '<div class="dna-stem-box">'+
                '<small>'+esc(s.label)+'</small>'+
                '<b style="color:var(--fg)"'+nmTitle(s.pct)+'>'+(s.pct===null?NM:s.pct+'%')+'</b>'+
              '</div>'
            ).join('')+
          '</div>'+
        '</div>'+
      '</div>'+

      '<h2 class="sh">Acoustic traits</h2>'+
      '<p class="shs">Strongest first. Choose a trait to inspect its constituent features and time-aligned passages.</p>'+
      '<div class="tlist">'+trows+'</div>'+
      renderPbar()+
    '</div>';

    // Build fine ticks in #ring
    const ring=$('ring');
    if(ring){
      let idx=0;
      const frag=document.createDocumentFragment();
      families.forEach((fam,ti)=>{
        const span=fam.n*3;
        const isCur=ti===curFam;
        for(let k=0;k<span;k++){
          const swell=Math.sin(Math.PI*(k+0.5)/span);
          // Tick height is drawing geometry only; an unmeasured family gets the minimum height.
          const len=Math.round(14+22*swell*((fam.pct||0)/100));
          const col=isCur?'var(--accent)':(curFam===-1?'#b4b4b9':'var(--off)');
          const tickEl=document.createElement('div');
          tickEl.className='dna-tick';
          tickEl.style.cssText='position:absolute;left:'+(R-1)+'px;top:0;width:2px;height:'+len+'px;border-radius:1px;background:'+col+';transform-origin:1px '+R+'px;transform:rotate('+(idx/T*360)+'deg);transition:background .2s, height .2s;cursor:pointer';
          tickEl.dataset.act='trait';
          tickEl.dataset.v=String(ti);
          tickEl.onmouseenter=()=>{
            const rnEl=$('rn'); if(rnEl){rnEl.textContent=fam.pctText;rnEl.title=fam.pct===null?NM_TIP:'';}
            const rtEl=$('rt'); if(rtEl)rtEl.textContent=fam.short;
            const rmEl=$('rm'); if(rmEl)rmEl.textContent=fam.sub;
          };
          frag.appendChild(tickEl);
          idx++;
        }
        for(let g=0;g<3;g++){
          const gap=document.createElement('div');
          gap.className='dna-tick';
          gap.style.cssText='position:absolute;left:'+(R-1)+'px;top:0;width:2px;height:4px;border-radius:1px;background:#1f1f23;transform-origin:1px '+R+'px;transform:rotate('+(idx/T*360)+'deg)';
          frag.appendChild(gap);
          idx++;
        }
      });
      ring.insertBefore(frag,ring.firstChild);
    }

    // Circumplex SVG Trajectory
    const svgEl=$('c-svg');
    if(svgEl&&vaList.length){
      const cw=290, ch=290, ccx=145, ccy=145, cr=105;
      const mapPt=p=>[ccx+cl(p.valence,-1,1)*cr, ccy-cl(p.arousal,-1,1)*cr];
      let dPath='';
      vaList.forEach((p,i)=>{
        const [x,y]=mapPt(p);
        if(i===0)dPath+='M '+x.toFixed(1)+' '+y.toFixed(1);
        else dPath+=' L '+x.toFixed(1)+' '+y.toFixed(1);
      });
      svgEl.innerHTML='<path d="'+dPath+'" fill="none" stroke="rgba(142,197,184,0.32)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>'+
        vaList.map((p,i)=>{
          const [x,y]=mapPt(p);
          const isSelected=S.sel&&Math.max(S.sel.a,p.startSec)<Math.min(S.sel.b,p.endSec);
          const q=(p.valence>=0&&p.arousal>=0)?'Exuberant':(p.valence<0&&p.arousal>=0)?'Turbulent':(p.valence<0&&p.arousal<0)?'Melancholic':'Calm';
          return '<circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+(isSelected?4.5:2.6)+'" fill="'+(isSelected?'#8ec5b8':'rgba(142,197,184,0.72)')+'" stroke="'+(isSelected?'#fff':'none')+'" stroke-width="1" style="cursor:pointer" data-act="play-win" data-v="'+i+'" onmouseenter="const rnEl=$(\'rn\');if(rnEl)rnEl.textContent=\''+q+'\';const rtEl=$(\'rt\');if(rtEl)rtEl.textContent=\'Valence '+(p.valence>=0?'+':'')+Number(p.valence).toFixed(2)+' · Arousal '+(p.arousal>=0?'+':'')+Number(p.arousal).toFixed(2)+'\';const rmEl=$(\'rm\');if(rmEl)rmEl.textContent=\'Window '+(i+1)+' ('+fmt(p.startSec)+'–'+fmt(p.endSec)+')\';" onmouseleave="const rnEl=$(\'rn\');if(rnEl)rnEl.textContent=\''+selFam.pctText+'\';const rtEl=$(\'rt\');if(rtEl)rtEl.textContent=\''+esc(selFam.short)+'\';const rmEl=$(\'rm\');if(rmEl)rmEl.textContent=\''+esc(selFam.sub)+'\';">'+
            '<title>Window '+(i+1)+' ('+fmt(p.startSec)+'–'+fmt(p.endSec)+'): Valence '+Number(p.valence).toFixed(2)+', Arousal '+Number(p.arousal).toFixed(2)+'</title>'+
          '</circle>';
        }).join('');
    }
  }

  /* ---------- View 3: Embedding Space (Self-Similarity Matrix, 2D PCA, 3-Model Cosine Trajectory, Embedding Heatmap) ---------- */
  function renderEmbeddingsView(){
    const segs=S.data?.multimodal?.segments||[];
    const anchor=segs[S.anchorIdx]||segs[0]||{startSec:0,endSec:12};
    const compareIdx=S.compareIdx!==undefined?S.compareIdx:S.anchorIdx;
    const comp=segs[compareIdx]||anchor;
    const modeKey=S.etab===0?'embedding':S.etab===1?'deepEmbedding':'dspEmbedding';
    const matKey=S.etab===0?'multimodal':S.etab===1?'deep':'dsp';
    const modeLabel=S.etab===0?'Multimodal Fused (89-D)':S.etab===1?'Pretrained Deep Encoder (64-D)':'Librosa DSP Vector (25-D)';
    const rawPca=S.data?.pcaByMode?.[matKey];
    const pcaPts=Array.isArray(rawPca)?rawPca:(rawPca?.points||S.data?.pcaPoints||[]);
    // FIX: PCA variance fell back to [48,26], so the title read "PC1 48% vs PC2 26%" when the backend
    // sent no variance (the demo sends a plain point list). Now "—" when not sent.
    const pcaVariance=Array.isArray(rawPca?.variancePct)?rawPca.variancePct:['—','—'];
    const simMat=S.data?.similarityMatrices?.[matKey]||[];
    // FIX: a missing similarity cell showed as 1.0000 (perfect match). Now null -> "—".
    const pairSim=(simMat[S.anchorIdx]&&Number.isFinite(Number(simMat[S.anchorIdx][compareIdx])))?Number(simMat[S.anchorIdx][compareIdx]):null;

    const scored=segs.map((s,i)=>{
      const vA=anchor?.[modeKey]||anchor?.embedding;
      const vB=s[modeKey]||s.embedding;
      return {s,i,sim:cosine(vA,vB)};
    });
    const topRows=(S.showAllWindows?scored:scored.slice().sort((a,b)=>b.sim-a.sim).slice(0,12)).map(({s,i,sim})=>{
      const pctSim=Math.max(0,Math.round(sim*100));
      const isAnchor=i===S.anchorIdx;
      const vB=s[modeKey]||s.embedding;
      return '<li class="row" style="cursor:pointer" data-act="set-anchor" data-v="'+i+'">'+
        '<button class="cplay" data-act="play-win" data-v="'+i+'" aria-label="Play window">'+svg('i-play',12)+'</button>'+
        '<div class="mw" aria-hidden="true">'+vectorBars(vB,isAnchor)+'</div>'+
        '<div class="info">'+
          '<div class="s">Window '+(i+1)+' <span>— '+fmt(s.startSec)+' to '+fmt(s.endSec)+'</span>'+(isAnchor?' <span class="pill ok">Anchor</span>':'')+'</div>'+
          '<div class="w">'+modeLabel+' · L2 norm 1.000 · Cosine similarity to Window '+(S.anchorIdx+1)+': <b>'+sim.toFixed(4)+'</b></div>'+
        '</div>'+
        '<div class="prog'+(isAnchor||sim>0.85?' on':'')+'"><i style="width:'+pctSim+'%"></i></div>'+
        '<span class="r" style="color:'+(isAnchor?'var(--accent)':'var(--fg)')+';width:52px;text-align:right">'+pctSim+'%</span>'+
      '</li>';
    }).join('');

  function drawEmbeddingCanvases(onlyOverlays=false){
    const segs=S.data?.multimodal?.segments||[];
    if(!segs.length)return;
    const matKey=S.etab===0?'multimodal':S.etab===1?'deep':'dsp';
    const modeKey=S.etab===0?'embedding':S.etab===1?'deepEmbedding':'dspEmbedding';
    const simMat=S.data?.similarityMatrices?.[matKey]||[];
    const N=segs.length, dur=S.dur||32;
    const compareIdx=S.compareIdx!==undefined?S.compareIdx:S.anchorIdx;

    if(!onlyOverlays){
      // 1. Self-Similarity Matrix (static unless anchor/tab changes)
      const cSsm=prepCanvas('cv-ssm');
      if(cSsm&&simMat.length){
        const {ctx,w,h}=cSsm;
        const size=Math.min(w-48,h-32);
        const ox=Math.round((w-size)/2), oy=8;
        const cell=size/N;
        for(let i=0;i<N;i++){
          for(let j=0;j<N;j++){
            const s=Math.max(0,Math.min(1,(simMat[i][j]-0.2)/0.8));
            const rgb=magmaRgb(s);
            ctx.fillStyle='rgb('+rgb[0]+','+rgb[1]+','+rgb[2]+')';
            ctx.fillRect(ox+j*cell,oy+i*cell,cell+0.6,cell+0.6);
          }
        }
        ctx.strokeStyle='#8EC5B8';
        ctx.lineWidth=1.8;
        ctx.strokeRect(ox+compareIdx*cell,oy+S.anchorIdx*cell,Math.max(4,cell),Math.max(4,cell));
        ctx.fillStyle='#85858B';
        ctx.font='10px Inter, sans-serif';
        ctx.textAlign='left';ctx.fillText('Win 1 (0:00)',ox,oy+size+14);
        ctx.textAlign='right';ctx.fillText('Win '+N+' ('+fmt(dur)+')',ox+size,oy+size+14);
        cSsm.cv._ssmBox={ox,oy,size,N};
      }

      // 2. 2D PCA Scatter & Trajectory (static unless anchor/selection/tab changes)
      const cPca=prepCanvas('cv-pca');
      if(cPca){
        const {ctx,w,h}=cPca;
        const rawPca=S.data?.pcaByMode?.[matKey];
        const pts=Array.isArray(rawPca)?rawPca:(rawPca?.points||S.data?.pcaPoints||[]);
        const pad=28, pw=w-pad*2, ph=h-pad*2;
        ctx.fillStyle='#0B0B0D';ctx.fillRect(pad,pad,pw,ph);
        ctx.strokeStyle='#1F1F23';ctx.strokeRect(pad,pad,pw,ph);
        ctx.beginPath();
        ctx.moveTo(pad,pad+ph/2);ctx.lineTo(pad+pw,pad+ph/2);
        ctx.moveTo(pad+pw/2,pad);ctx.lineTo(pad+pw/2,pad+ph);
        ctx.stroke();

        ctx.strokeStyle='rgba(161,161,166,0.3)';
        ctx.lineWidth=1.2;
        ctx.beginPath();
        pts.forEach((p,i)=>{
          const x=pad+p[0]*pw, y=pad+(1-p[1])*ph;
          if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
        });
        ctx.stroke();

        const pixelPts=[];
        pts.forEach((p,i)=>{
          const s=segs[i]||{startSec:0,endSec:0};
          const x=pad+p[0]*pw, y=pad+(1-p[1])*ph;
          pixelPts.push({x,y,i});
          const inSel=S.sel&&Math.max(S.sel.a,s.startSec)<Math.min(S.sel.b,s.endSec);
          const isAnchor=i===S.anchorIdx;
          ctx.beginPath();
          ctx.arc(x,y,isAnchor?6.5:(inSel?4.8:3.3),0,Math.PI*2);
          ctx.fillStyle=isAnchor?'#E2A86B':(inSel?'#8EC5B8':'#686874');
          ctx.fill();
        });
        cPca.cv._pcaPts=pixelPts;
      }
    }

    // 3. Multi-Representation Cosine Similarity Trajectory (cached background + fast overlay)
    const cSim=prepCanvas('cv-sim-curve', onlyOverlays);
    if(cSim){
      const mMat=S.data?.similarityMatrices;
      if(!onlyOverlays||!restoreCanvasBg(cSim)){
        drawPlotAxes(cSim.ctx,cSim.w,cSim.h,['1.00','0.50','0.00']);
        if(mMat){
          if(mMat.dsp?.[S.anchorIdx])traceSeries(cSim.ctx,mMat.dsp[S.anchorIdx],cSim.pw,cSim.ph,0,1.0,'#829CD0',null,1.4,[3,3]);
          if(mMat.deep?.[S.anchorIdx])traceSeries(cSim.ctx,mMat.deep[S.anchorIdx],cSim.pw,cSim.ph,0,1.0,'#E2A86B',null,1.5);
          if(mMat.multimodal?.[S.anchorIdx])traceSeries(cSim.ctx,mMat.multimodal[S.anchorIdx],cSim.pw,cSim.ph,0,1.0,'#8EC5B8','rgba(142,197,184,0.14)',2.0);
        }
        saveCanvasBg(cSim);
      }
      drawSyncedOverlays(cSim.ctx,cSim.w,cSim.h,t=>{
        const wi=Math.min(N-1,Math.max(0,Math.floor((t/dur)*N)));
        const simV=mMat?.[matKey]?.[S.anchorIdx]?.[wi]||0;
        return {text:fmt(t)+' · Win '+(wi+1)+' Cosine to Win '+(S.anchorIdx+1)+': '+simV.toFixed(4)};
      });
    }

    // 4. Full-Track Embedding Activation Heatmap (cached ImageData background + fast overlay)
    const cHeat=prepCanvas('cv-emb-heat', onlyOverlays);
    if(cHeat){
      const dim=(segs[0]?.[modeKey]||segs[0]?.embedding||[]).length||64;
      if(!onlyOverlays||!restoreCanvasBg(cHeat)){
        drawPlotAxes(cHeat.ctx,cHeat.w,cHeat.h,['d1','d'+Math.round(dim/2),'d'+dim]);
        const mat=Array.from({length:dim},(_,d)=>segs.map(s=>Number((s[modeKey]||s.embedding||[])[d]||0)));
        drawHeatmapBilinear(cHeat,mat,-0.25,0.25,(_,v)=>{
          const z=Math.max(-1,Math.min(1,(v||0)/0.25));
          if(z>=0)return [Math.round(14+128*z),Math.round(14+183*z),Math.round(18+166*z)];
          const nz=-z;
          return [Math.round(14+203*nz),Math.round(14+109*nz),Math.round(18+118*nz)];
        });
        saveCanvasBg(cHeat);
      }
      drawSyncedOverlays(cHeat.ctx,cHeat.w,cHeat.h,t=>{
        const wi=Math.min(N-1,Math.max(0,Math.floor((t/dur)*N)));
        return {text:fmt(t)+' · Window '+(wi+1)+' ('+dim+'-D L2-normalized vector)'};
      });
    }
  }

  function bindEmbeddingCanvases(){
    bindTimeCanvasesByIds(['cv-sim-curve','cv-emb-heat'], drawEmbeddingCanvases);
    const ssm=$('cv-ssm');
    if(ssm&&!ssm._ssmBound){
      ssm._ssmBound=true;
      ssm.onclick=async e=>{
        const b=ssm._ssmBox;if(!b)return;
        const r=ssm.getBoundingClientRect();
        const j=Math.floor((e.clientX-r.left-b.ox)/b.size*b.N);
        const i=Math.floor((e.clientY-r.top-b.oy)/b.size*b.N);
        if(i>=0&&i<b.N&&j>=0&&j<b.N){
          S.anchorIdx=i;S.compareIdx=j;
          const seg=S.data?.multimodal?.segments?.[i];
          if(seg){S.sel={a:seg.startSec,b:seg.endSec};seekTo(seg.startSec,seg.endSec);try{await audio.play();S.playing=true;}catch(err){}}
          renderEmbeddingsView();
        }
      };
    }
    const pca=$('cv-pca');
    if(pca&&!pca._pcaBound){
      pca._pcaBound=true;
      pca.onclick=async e=>{
        const pts=pca._pcaPts||[];
        const r=pca.getBoundingClientRect();
        const mx=e.clientX-r.left, my=e.clientY-r.top;
        let best=-1, bd=400;
        pts.forEach(p=>{const d=(p.x-mx)*(p.x-mx)+(p.y-my)*(p.y-my);if(d<bd){bd=d;best=p.i;}});
        if(best>=0){
          S.anchorIdx=best;
          const seg=S.data?.multimodal?.segments?.[best];
          if(seg){S.sel={a:seg.startSec,b:seg.endSec};seekTo(seg.startSec,seg.endSec);try{await audio.play();S.playing=true;}catch(err){}}
          renderEmbeddingsView();
        }
      };
    }
  }

  function drawActiveCanvases(onlyOverlays=false){
    const va=S.data?.dynamicVA||[];
    const dur=S.dur||32;

    // 1. Valence & Arousal Time Series (cached background + fast overlay)
    const cVaT=prepCanvas('cv-va-time', onlyOverlays);
    if(cVaT&&va.length){
      if(!onlyOverlays||!restoreCanvasBg(cVaT)){
        drawPlotAxes(cVaT.ctx,cVaT.w,cVaT.h,['+1.0','0.0','-1.0']);
        const valArr=va.map(v=>v.valence);
        const aroArr=va.map(v=>v.arousal);
        traceSeries(cVaT.ctx,valArr,cVaT.pw,cVaT.ph,-1.0,1.0,'#8EC5B8','rgba(142,197,184,0.12)',1.9);
        traceSeries(cVaT.ctx,aroArr,cVaT.pw,cVaT.ph,-1.0,1.0,'#E2A86B','rgba(226,168,107,0.12)',1.9);
        saveCanvasBg(cVaT);
      }
      drawSyncedOverlays(cVaT.ctx,cVaT.w,cVaT.h,t=>{
        const wi=Math.min(va.length-1,Math.max(0,Math.floor((t/dur)*va.length)));
        const item=va[wi]||{valence:0,arousal:0};
        return {text:fmt(t)+' · Valence '+(item.valence>=0?'+':'')+item.valence.toFixed(3)+' · Arousal '+(item.arousal>=0?'+':'')+item.arousal.toFixed(3)};
      });
    }

    if(onlyOverlays)return;

    // 2. 2D Russell Circumplex Plane
    const cVaP=prepCanvas('cv-va-plane');
    if(cVaP&&va.length){
      const {ctx,w,h}=cVaP;
      const pad=24, pw=w-pad*2, ph=h-pad*2;
      ctx.fillStyle='#0B0B0D';ctx.fillRect(pad,pad,pw,ph);
      ctx.strokeStyle='#1F1F23';ctx.strokeRect(pad,pad,pw,ph);
      ctx.beginPath();
      ctx.moveTo(pad,pad+ph/2);ctx.lineTo(pad+pw,pad+ph/2);
      ctx.moveTo(pad+pw/2,pad);ctx.lineTo(pad+pw/2,pad+ph);
      ctx.stroke();

      ctx.fillStyle='#85858B';ctx.font='10px Inter, sans-serif';
      ctx.textAlign='left';ctx.fillText('Turbulent / Tense (−V, +A)',pad+6,pad+14);
      ctx.textAlign='right';ctx.fillText('Exuberant / Intense (+V, +A)',pad+pw-6,pad+14);
      ctx.textAlign='left';ctx.fillText('Melancholic (−V, −A)',pad+6,pad+ph-8);
      ctx.textAlign='right';ctx.fillText('Calm / Serene (+V, −A)',pad+pw-6,pad+ph-8);

      ctx.strokeStyle='rgba(142,197,184,0.32)';
      ctx.lineWidth=1.2;
      ctx.beginPath();
      va.forEach((v,i)=>{
        const x=pad+((v.valence+1)/2)*pw, y=pad+((1-v.arousal)/2)*ph;
        if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
      });
      ctx.stroke();

      const vaPts=[];
      va.forEach((v,i)=>{
        const x=pad+((v.valence+1)/2)*pw, y=pad+((1-v.arousal)/2)*ph;
        vaPts.push({x,y,v});
        const inSel=S.sel&&Math.max(S.sel.a,v.startSec)<Math.min(S.sel.b,v.endSec);
        ctx.beginPath();ctx.arc(x,y,inSel?5:3.3,0,Math.PI*2);
        ctx.fillStyle=inSel?'#8EC5B8':'#E2A86B';ctx.fill();
      });
      cVaP.cv._vaPts=vaPts;
    }

    // 3. DMER Benchmark Chart
    const cBench=prepCanvas('cv-dmer-bench');
    if(cBench){
      const {ctx,w}=cBench;
      const b=S.data?.dmerBenchmark?.baselines||{};
      // FIX: missing scores fell back to invented values (CCC 0.74/0.61/0.42, RMSE 0.18/0.24/0.31), so the
      // chart showed results that were never computed. Now the row reads "CCC — · RMSE —" with no bar.
      const num=v=>(v!==undefined&&v!==null&&Number.isFinite(Number(v)))?Number(v):null;
      const rows=[
        ['Personalized-DMER (AAAI 2025)',num(b.personalized_dmer?.ccc),num(b.personalized_dmer?.rmse),'#8EC5B8'],
        ['Population Dual-Scale Attn',num(b.population_dual_scale_attention?.ccc),num(b.population_dual_scale_attention?.rmse),'#829CD0'],
        ['Static Ridge Regression',num(b.static_ridge?.ccc),num(b.static_ridge?.rmse),'#686874']
      ];
      ctx.font='500 12px Inter, sans-serif';
      rows.forEach((r,idx)=>{
        const y=28+idx*68;
        ctx.fillStyle='#DCDCE0';ctx.textAlign='left';
        ctx.fillText(r[0],14,y);
        ctx.fillStyle='#A1A1A6';ctx.textAlign='right';
        ctx.fillText('CCC '+(r[1]===null?'—':r[1].toFixed(3))+' · RMSE '+(r[2]===null?'—':r[2].toFixed(3)),w-14,y);
        ctx.fillStyle='#151518';
        ctx.fillRect(14,y+10,w-28,14);
        ctx.fillStyle=r[3];
        if(r[1]!==null)ctx.fillRect(14,y+10,Math.max(8,(w-28)*Math.min(1,r[1])),14);
      });
    }
  }

    $('main').innerHTML='<div class="col pcol">'+
      '<h1 class="ph1">Models &amp; Weight Licenses</h1>'+
      '<p class="lead">Source-code licenses and pretrained checkpoint weight licenses are verified independently before extraction.</p>'+
      '<ol class="list">'+rows+'</ol>'+
      renderPbar()+
    '</div>';
  }

  /* ---------- Analysis Progress Screen & Recordings Manager ---------- */
  function renderAnalyzingView(){
    const A=S.analyzing||{name:'Audio file',step:1,pct:30,msg:'Running local Python analysis…'};
    const steps=[
      ['1. Audio decoding & windowing','Splitting recording into overlapping 12-second windows (6-second hop)',A.step>=1,A.step===1],
      ['2. Librosa DSP extraction (25-D)','Computing RMS energy slope, vocal-band presence (300–3400 Hz), spectral flatness, flux, 12-pitch chroma, and MFCCs',A.step>=2,A.step===2],
      ['3. Pretrained neural encoder (64-D) & fusion (89-D)','Running spectro-temporal self-attention checkpoint and L2-normalized multimodal fusion',A.step>=3,A.step===3],
      ['4. TROMPA-MER active learning & Personalized-DMER','Ranking uncertain passages and evaluating dynamic Valence-Arousal trajectories',A.step>=4,A.step===4]
    ];
    $('main').innerHTML='<div class="col pcol" style="justify-content:center">'+
      '<div class="eyebrow">LOCAL PYTHON ANALYSIS IN PROGRESS</div>'+
      '<h1 class="ph1" style="margin-top:6px">Analyzing '+esc(A.name)+'…</h1>'+
      '<p class="lead">'+esc(A.msg)+'</p>'+
      '<div style="margin:28px 0 12px;height:2px;background:var(--line2);width:100%;position:relative"><i style="position:absolute;left:0;top:0;bottom:0;width:'+A.pct+'%;background:var(--accent);transition:width .3s ease"></i></div>'+
      '<div class="tlist" style="margin-top:20px">'+steps.map(st=>
        '<div class="trow'+(st[3]?' on':'')+'">'+
          '<div class="tmain"><span class="tname">'+st[0]+'<small>'+st[1]+'</small></span></div>'+
          '<div class="hear"><span><b>'+(st[3]?'Running now…':st[2]?'Completed':'Queued')+'</b></span></div>'+
          '<div class="tans"><span class="pill'+(st[2]?' ok':'')+'">'+(st[3]?'In progress':st[2]?'Done':'Waiting')+'</span></div>'+
        '</div>'
      ).join('')+'</div>'+
    '</div>';
  }

  function renderFilesView(){
    const uploaded=S.sqliteTracks;
    const upRows=uploaded.map(t=>{
      const isCur=S.data?.trackId===t.trackId||S.data?.title===t.title;
      return '<li class="lrow">'+
        '<button class="cplay" data-act="play-track-inline" data-v="'+esc(t.trackId)+'" title="Play in place">'+svg(isCur&&S.playing?'i-pause':'i-play',12)+'</button>'+
        '<div class="info" style="cursor:pointer" data-act="load-sqlite" data-v="'+esc(t.trackId)+'">'+
          '<div class="s">'+esc(t.title)+' '+(isCur?'<span class="pill ok" style="margin-left:8px">Open</span>':'')+'</div>'+
          '<div class="meta">Duration '+fmt(t.durationSec)+' · Representations: '+esc(t.methods.join(', '))+'</div>'+
        '</div>'+
        '<span class="pill ok">Analyzed</span>'+
        '<button class="ghost" data-act="load-sqlite" data-v="'+esc(t.trackId)+'">Inspect →</button>'+
        '<button class="ib" style="width:34px;height:34px;color:var(--mute)" data-act="del-sqlite" data-v="'+esc(t.trackId)+'" title="Delete from database">'+svg('i-x',14)+'</button>'+
      '</li>';
    }).join('');

    $('main').innerHTML='<div class="col pcol">'+
      '<div style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px">'+
        '<div><div class="eyebrow" style="margin-bottom:6px">RECORDINGS &amp; PIPELINE</div><h1 class="ph1">Analyzed Recordings</h1>'+
        '<p class="lead">Click play to listen in place, or click a song title to open its waveform and spectral plots.</p></div>'+
        '<button class="primary" data-act="upload">+ Upload &amp; analyze audio file</button>'+
      '</div>'+
      '<h2 class="sh" style="margin-top:32px">Your uploaded &amp; analyzed songs ('+uploaded.length+')</h2>'+
      '<ol class="list">'+(upRows||'<li class="lrow" style="color:var(--sub)">No uploaded recordings in SQLite yet. Click "+ Upload &amp; analyze audio file" above to run the pipeline.</li>')+'</ol>'+
      '<h2 class="sh" style="margin-top:32px">Built-in reference recording</h2>'+
      '<ol class="list">'+
        '<li class="lrow">'+
          '<button class="cplay" data-act="play-track-inline" data-v="original-demo">'+svg(S.data?.trackId==='original-demo'&&S.playing?'i-pause':'i-play',12)+'</button>'+
          '<div class="info" style="cursor:pointer" data-act="load-demo"><div class="s">First Light <span>— Music DNA original demo</span>'+(S.data?.trackId==='original-demo'?' <span class="pill ok">Open</span>':'')+'</div>'+
          '<div class="meta">Duration 0:32 · Representations: dsp, clap, multimodal</div></div>'+
          '<span class="pill ok">Ready</span>'+
          '<button class="ghost" data-act="load-demo">Inspect →</button>'+
        '</li>'+
      '</ol>'+
      renderPbar()+
    '</div>';
  }

  function render(){
    renderSidebar();
    if(S.analyzing){renderAnalyzingView();return;}
    if(S.view==='files')renderFilesView();
    else if(S.view==='waveform')renderWaveformView();
    else if(S.view==='ring')renderRingView();
    else if(S.view==='embeddings')renderEmbeddingsView();
    else if(S.view==='active')renderActiveView();
    else renderModelsView();
    const v=$('vol');
    if(v)v.oninput=()=>{audio.volume=Number(v.value)/100;};
  }

  document.addEventListener('click',async e=>{
    const el=e.target.closest('[data-act]');if(!el)return;
    const act=el.dataset.act, v=el.dataset.v;
    if(act==='view'){S.view=v;try{history.replaceState(null,'','?view='+v);}catch(e){}render();}
    else if(act==='trait'){S.trait=+v;renderRingView();}
    else if(act==='etab'){S.etab=+v;renderEmbeddingsView();}
    else if(act==='set-anchor'){S.anchorIdx=+v;renderEmbeddingsView();}
    else if(act==='toggle-all-wins'){S.showAllWindows=!S.showAllWindows;render();}
    else if(act==='sel-win'){
      const idx=+v;
      S.openWin=(S.openWin===idx)?-1:idx;
      const seg=S.data?.multimodal?.segments?.[idx];
      if(seg){S.sel={a:seg.startSec,b:seg.endSec};seekTo(seg.startSec,seg.endSec);await inspectSelection();}
      render();
    }
    else if(act==='play-win'){
      e.stopPropagation();
      const seg=S.data?.multimodal?.segments?.[+v];
      if(seg){
        const sameRange=S.sel&&Math.abs(S.sel.a-seg.startSec)<0.5&&Math.abs(S.sel.b-seg.endSec)<0.5;
        if(sameRange&&!audio.paused){
          audio.pause();S.playing=false;render();return;
        }
        S.sel={a:seg.startSec,b:seg.endSec};
        seekTo(seg.startSec,seg.endSec);
        try{await audio.play();S.playing=true;}catch(err){}
        await inspectSelection();
        render();
      }
    }
    else if(act==='play-range'){
      e.stopPropagation();
      const [a,b]=v.split(':').map(Number);
      S.sel={a,b};seekTo(a,b);try{await audio.play();S.playing=true;}catch(err){}await inspectSelection();render();
    }
    else if(act==='play-sel'){
      if(S.sel){
        if(!audio.paused){
          audio.pause();S.playing=false;
          if(S.view==='waveform'){drawWave();updateDawPlayhead();}else render();
          return;
        }
        seekTo(S.sel.a,S.sel.b);try{await audio.play();S.playing=true;}catch(err){}
        if(S.view==='waveform'){drawWave();updateDawPlayhead();}else render();
      }
    }
    else if(act==='play'){
      if(audio.paused){
        if(S.sel){
          if(S.t<S.sel.a||S.t>=S.sel.b-0.15)seekTo(S.sel.a,S.sel.b);
          else S.previewEnd=S.sel.b;
        }else{
          S.previewEnd=null;
        }
        try{await audio.play();S.playing=true;}catch(err){}
      }else{audio.pause();S.playing=false;}
      const pb=document.querySelector('.play');if(pb)pb.innerHTML=svg(S.playing?'i-pause':'i-play',20);
      if(S.view==='waveform'){drawWave();updateDawPlayhead();}
      else if(S.view==='files'){renderFilesView();}
    }
    else if(act==='play-track-inline'){
      e.stopPropagation();
      const isSame=(v==='original-demo'&&S.data?.trackId==='original-demo')||(S.data?.trackId===v);
      if(isSame){
        if(audio.paused){try{await audio.play();S.playing=true;}catch(err){}}
        else{audio.pause();S.playing=false;}
        render();
      }else{
        await loadTrackById(v,false);
        try{await audio.play();S.playing=true;}catch(err){}
        render();
      }
    }
    else if(act==='seek'){
      const nextT=Math.max(0,Math.min(S.dur,(S.t||0)+Number(v)));
      seekTo(nextT,(S.sel&&nextT>=S.sel.a&&nextT<=S.sel.b)?S.sel.b:null);
      if(S.view==='waveform'){drawWave();updateDawPlayhead();}
      else if(S.view==='embeddings'){drawEmbeddingCanvases(true);}
      else if(S.view==='active'){drawActiveCanvases(true);}
    }
    else if(act==='loop'){
      if(!S.sel)S.sel={a:Math.max(0,S.t-4),b:Math.min(S.dur,Math.max(0,S.t-4)+12)};
      S.loop=!S.loop;if(S.loop&&S.sel){seekTo(S.sel.a,S.sel.b);if(audio.paused){audio.play().catch(()=>{});S.playing=true;}}
      if(S.view==='waveform'){drawWave();updateDawPlayhead();}else render();
    }
    else if(act==='clear-sel'){
      S.sel=null;S.previewEnd=null;S.loop=false;render();
    }
    else if(act==='upload'){$('file-input').click();}
    else if(act==='load-demo'){await loadTrackById('original-demo',true);toast('Loaded First Light');}
    else if(act==='load-sqlite'){await loadTrackById(v,true);toast('Loaded '+S.data?.title);}
    else if(act==='del-sqlite'){
      await fetch('/api/db/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({trackId:v})});
      await loadSqliteList();
      render();
      toast('Removed recording from SQLite.');
    }
  });

  $('file-input').addEventListener('change',async e=>{
    const file=e.target.files[0];if(!file)return;
    const cleanTitle=file.name.replace(/\.[^.]+$/,'').replace(/_/g,' ');
    S.analyzing={name:cleanTitle,step:1,pct:25,msg:'Step 1/4 · Decoding audio and slicing 12-second windows…'};
    render();
    const timer1=setTimeout(()=>{if(S.analyzing){S.analyzing.step=2;S.analyzing.pct=55;S.analyzing.msg='Step 2/4 · Extracting 25-D librosa DSP descriptors & continuous spectral curves…';render();}},450);
    const timer2=setTimeout(()=>{if(S.analyzing){S.analyzing.step=3;S.analyzing.pct=80;S.analyzing.msg='Step 3/4 · Running 64-D pretrained spectro-temporal transformer & multimodal fusion…';render();}},1100);
    const form=new FormData();
    form.append('file',file,file.name);
    form.append('method','both');
    form.append('track_id',cleanTitle);
    form.append('track_title',cleanTitle);
    form.append('local_analysis_confirmed','true');
    const res=await fetch('/api/analyze',{method:'POST',body:form});
    clearTimeout(timer1);clearTimeout(timer2);
    if(!res.ok){S.analyzing=null;render();toast('Analysis failed');return;}
    await loadSqliteList();
    await loadTrackById(cleanTitle,true);
    toast('Analysis complete · '+cleanTitle);
    e.target.value='';
  });

  audio.addEventListener('timeupdate',()=>{
    if(Date.now()<seekGuardUntil)return;
    S.t=audio.currentTime;
    if(S.loop&&S.sel&&S.t>=S.sel.b-0.04){
      seekTo(S.sel.a,S.sel.b);
      return;
    }
    if(S.previewEnd!==null&&S.t>=S.previewEnd&&!S.loop){
      S.previewEnd=null;
      audio.pause();
      S.playing=false;
      if(S.sel){seekTo(S.sel.a,null);}
      if(S.view==='waveform'){drawWave();updateDawPlayhead();}else render();
      return;
    }
    if(S.view==='waveform'){
      drawWave();
      updateDawPlayhead();
    }
    else if(S.view==='embeddings'){drawEmbeddingCanvases(true);if($('tnow'))$('tnow').textContent=fmt(S.t);}
    else if(S.view==='active'){drawActiveCanvases(true);if($('tnow'))$('tnow').textContent=fmt(S.t);}
    else if($('tnow'))$('tnow').textContent=fmt(S.t);
  });
  audio.addEventListener('error',()=>{
    if(audio.src&&!audio.src.endsWith('/api/audio/original-demo')){
      audio.src='/api/audio/original-demo';
      audio.load();
    }
  });

  let playheadRaf = null;
  function startPlayheadAnim(){
    if(playheadRaf) cancelAnimationFrame(playheadRaf);
    function step(){
      if(S.playing && !audio.paused && !audio.ended){
        S.t = audio.currentTime;
        updateDawPlayhead();
        if(S.view === 'waveform') drawWave();
        playheadRaf = requestAnimationFrame(step);
      }
    }
    playheadRaf = requestAnimationFrame(step);
  }

  audio.addEventListener('play',()=>{
    S.playing=true;
    const pb=document.querySelector('.play');if(pb)pb.innerHTML=svg('i-pause',20);
    startPlayheadAnim();
  });
  audio.addEventListener('pause',()=>{
    S.playing=false;
    const pb=document.querySelector('.play');if(pb)pb.innerHTML=svg('i-play',20);
    if(playheadRaf) cancelAnimationFrame(playheadRaf);
    updateDawPlayhead();
  });

  window.addEventListener('resize',()=>{
    if(S.view==='waveform'){
      drawWave();
      drawSpectralCanvases();
    }
    else if(S.view==='embeddings'){drawEmbeddingCanvases();}
    else if(S.view==='active'){drawActiveCanvases();}
  });
  loadDemo(false);
})();
</script>
</body>
</html>
