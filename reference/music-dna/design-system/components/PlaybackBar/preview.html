<!-- @dsCard group="Player" height=110 subtitle="Seamless, in the lower part of the screen" -->
<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css">
<style>
body{margin:0;background:var(--bg);font-family:var(--font-sans);color:var(--ink);font-variant-numeric:tabular-nums}
.bar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:20px 24px}
.t{font-size:13px;color:var(--ink-mute);white-space:nowrap}.t b{font-weight:400;color:var(--ink)}
.tp{display:flex;align-items:center;gap:14px}
.ib{width:44px;height:44px;border:0;border-radius:50%;background:none;color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer}
.ib.s{color:var(--ink-sub)}.ib:hover{background:var(--bg-raise)}
.play{width:52px;height:52px;border:1px solid rgba(220,220,224,0.5);border-radius:50%;background:none;color:var(--ink);display:flex;align-items:center;justify-content:center}
.r{display:flex;justify-content:flex-end;align-items:center;gap:10px;color:var(--ink-sub)}
input[type=range]{width:110px;accent-color:#a1a1a6}
</style>
<div class="bar" aria-label="Playback">
  <div class="t"><b>1:24</b> / 4:12</div>
  <div class="tp">
    <button class="ib s" aria-label="Save this moment"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7.5-4.6-7.5-10.2A4.2 4.2 0 0 1 12 7.4a4.2 4.2 0 0 1 7.5 2.4C19.5 15.4 12 20 12 20z"/></svg></button>
    <button class="ib" aria-label="Previous"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M19 5 9 12l10 7z" fill="currentColor"/></svg></button>
    <button class="play" aria-label="Pause"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="3.5" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="3.5" height="14" rx="1" fill="currentColor"/></svg></button>
    <button class="ib" aria-label="Next"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M5 5l10 7-10 7z" fill="currentColor"/></svg></button>
    <button class="ib s" aria-label="Loop selection" aria-pressed="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 2l3 3-3 3"/><path d="M4 11V9a4 4 0 0 1 4-4h12"/><path d="M7 22l-3-3 3-3"/><path d="M20 13v2a4 4 0 0 1-4 4H4"/></svg></button>
  </div>
  <div class="r"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4z"/><path d="M15.5 9a4 4 0 0 1 0 6"/></svg><input type="range" aria-label="Volume" value="62"></div>
</div>
