<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css">
<style>
body{margin:0;background:var(--bg);font-family:var(--font-sans);color:var(--ink)}
.side{width:244px;box-sizing:border-box;background:var(--bg-side);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:22px}
.brand{font-size:13px;font-weight:600;letter-spacing:.14em;color:var(--ink-sub);padding:0 10px}
.nav{display:flex;flex-direction:column;gap:2px}
.nv{height:42px;border:0;background:none;border-radius:10px;padding:0 10px;display:flex;align-items:center;gap:12px;font:15px var(--font-sans);color:var(--ink-sub);text-align:left}
.nv[aria-current="page"],.nv:hover{background:var(--bg-raise);color:var(--ink)}
.nv .b{margin-left:auto;font-size:12px;color:var(--ink-mute)}
.sec{font-size:12px;color:var(--ink-mute);letter-spacing:.06em;padding:0 10px}
</style>
<aside class="side">
  <div class="brand">MUSIC DNA</div>
  <nav class="nav">
    <button class="nv" aria-current="page"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h1M6.5 8v8M10 5v14M13.5 9v6M17 6v12M20.5 11v2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>Now playing</button>
    <button class="nv"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4v16M10 4v16M14.5 4.5l5 15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>Library<span class="b">7</span></button>
    <button class="nv"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7.5-4.6-7.5-10.2A4.2 4.2 0 0 1 12 7.4a4.2 4.2 0 0 1 7.5 2.4C19.5 15.4 12 20 12 20z"/></svg>My Moments<span class="b">4</span></button>
  </nav>
  <div class="sec">COLLECTIONS</div>
</aside>
