<!-- @dsCard group="Music DNA" height=200 subtitle="Seamless trait list: strength, best example, quick check" -->
<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css">
<style>
body{margin:0;background:var(--bg);font-family:var(--font-sans);color:var(--ink);font-variant-numeric:tabular-nums}
.list{margin:16px 24px;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,240px) 230px;align-items:center;gap:8px 24px;padding:14px 0;border-bottom:1px solid var(--line)}
.main{display:flex;align-items:center;gap:14px}
.meter{display:flex;gap:3px;align-items:flex-end}
.meter i{width:4px;height:14px;border-radius:2px;background:var(--line-strong)}
.meter i:nth-child(1){height:6px}.meter i:nth-child(2){height:9px}.meter i:nth-child(3){height:12px}
.meter i.f{background:var(--accent)}
.nm{font-size:16px}.nm small{display:block;font-size:13px;color:var(--ink-mute);margin-top:3px}
.on .nm{color:var(--accent)}
.hear{display:flex;align-items:center;gap:12px;font-size:14px}
.hear small{display:block;font-size:12px;color:var(--ink-mute)}
.cp{width:34px;height:34px;flex:none;border:1px solid var(--line-strong);border-radius:50%;background:none;color:var(--ink);display:flex;align-items:center;justify-content:center}
.ans{display:flex;justify-content:flex-end;align-items:center;gap:8px;font-size:14px;color:var(--ink-sub)}
.mini{height:30px;padding:0 12px;border-radius:15px;border:1px solid var(--line-strong);background:none;color:var(--ink);font:13px var(--font-sans)}
.ok{font-size:13px;color:var(--accent)}
</style>
<div class="list">
  <div class="row on"><div class="main"><span class="meter"><i class="f"></i><i class="f"></i><i class="f"></i><i class="f"></i></span><span class="nm">Expressive vocal transitions<small>A voice lifts or changes register · 12 moments</small></span></div>
    <div class="hear"><button class="cp" aria-label="Play"><svg width="11" height="11" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 5v14l12-7z" fill="currentColor"/></svg></button><span>Halflight 1:18–1:42<small>Vocal leap as the strings enter</small></span></div>
    <div class="ans"><span class="ok">Strong match</span></div></div>
  <div class="row"><div class="main"><span class="meter"><i class="f"></i><i></i><i></i><i></i></span><span class="nm">Emotional chord changes<small>Harmony that shifts the mood · 5 moments</small></span></div>
    <div class="hear"><button class="cp" aria-label="Play"><svg width="11" height="11" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 5v14l12-7z" fill="currentColor"/></svg></button><span>Paper Harbour 0:48–1:05<small>Major to minor IV</small></span></div>
    <div class="ans">Is this you?<button class="mini">Yes</button><button class="mini">Not really</button></div></div>
</div>
