<!-- @dsCard group="Music DNA" height=420 subtitle="Ticks grouped by trait, labelled with share of moments" -->
<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css">
<style>
body{margin:0;background:var(--bg);font-family:var(--font-sans);color:var(--ink)}
.stage{position:relative;height:400px}
#ring{position:absolute;left:50%;top:50%;width:300px;height:300px;margin:-150px 0 0 -150px}
.rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;color:var(--ink-mute)}
.rn{font-size:52px;font-weight:300;line-height:1;color:var(--ink)}
.rt{font-size:15px;color:var(--ink)}
.lab{position:absolute;display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--ink-sub);white-space:nowrap}
.lab b{font-size:20px;font-weight:400;color:var(--ink)}
.lab.on b{color:var(--accent)}
</style>
<div class="stage" id="stage"><div id="ring"><div class="rc"><span class="rn">38%</span><span class="rt">vocal transitions</span><span>of your saved moments</span></div></div></div>
<script>
(function(){
  var T=[['Vocal lifts',12],['Build-ups',8],['Textures',7],['Chord turns',5]],tot=32,R=150,N=0,cur=0;
  T.forEach(function(t){N+=t[1]*3+3;});
  var ring=document.getElementById('ring'),stage=document.getElementById('stage'),idx=0,seed=5,pos=0;
  T.forEach(function(t,ti){
    var span=t[1]*3,mid=(pos+span/2)/N*2*Math.PI;pos+=span+3;
    for(var k=0;k<span;k++){seed=(seed*9301+49297)%233280;tick(idx++,Math.round(12+24*(seed/233280)*Math.sin(Math.PI*(k+.5)/span)),ti===cur?'var(--accent)':'var(--wave-off)');}
    for(var g=0;g<3;g++)tick(idx++,4,'var(--line)');
    var x=Math.sin(mid),y=-Math.cos(mid),l=document.createElement('div');l.className='lab'+(ti===cur?' on':'');
    l.style.cssText='left:calc(50% + '+Math.round(x*196)+'px);top:calc(50% + '+Math.round(y*184)+'px);transform:translate('+(x>=0?'0':'-100%')+',-50%);text-align:'+(x>=0?'left':'right');
    l.innerHTML='<b>'+Math.round(t[1]/tot*100)+'%</b>'+t[0];stage.appendChild(l);
  });
  function tick(i,len,c){var e=document.createElement('div');e.style.cssText='position:absolute;left:'+(R-1)+'px;top:0;width:2px;height:'+len+'px;border-radius:1px;background:'+c+';transform-origin:1px '+R+'px;transform:rotate('+(i/N*360)+'deg)';ring.appendChild(e);}
})();
</script>
