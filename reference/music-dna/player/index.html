<title>Music DNA Player</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: app shell — sidebar (desktop) or bottom tabs (phone); one player screen whose states unfold in place */
:root{
  --bg:#0E0E10; --side:#0B0B0D; --panel:#151518; --raise:#1B1B1F; --line:#1F1F23; --line2:#2C2C31;
  --fg:#DCDCE0; --sub:#A1A1A6; --mute:#85858B; --off:#45454B; --accent:#8EC5B8;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none !important}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;margin:0;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button{font-family:inherit;color:inherit}
button:focus-visible,textarea:focus-visible{outline:1px solid var(--fg);outline-offset:2px}
.app{display:flex;min-height:100%}

/* sidebar */
.side{width:244px;flex:none;box-sizing:border-box;height:100vh;position:sticky;top:0;background:var(--side);border-right:1px solid var(--line);padding:28px 14px 18px max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:28px}
.brand{font-size:13px;font-weight:600;letter-spacing:.14em;color:var(--sub);padding:0 10px}
.nav{display:flex;flex-direction:column;gap:2px}
.nv{height:42px;border:0;background:none;border-radius:10px;padding:0 10px;display:flex;align-items:center;gap:12px;font-size:15px;color:var(--sub);cursor:pointer;text-align:left}
.nv:hover{background:var(--raise);color:var(--fg)}
.nv[aria-current="page"]{background:var(--raise);color:var(--fg)}
.nv .badge{margin-left:auto;font-size:12px;color:var(--mute)}
.sec{font-size:12px;color:var(--mute);letter-spacing:.06em;padding:0 10px;margin-bottom:6px}
.coll{height:36px;font-size:14px}
.mini-np{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:var(--panel);border:1px solid var(--line);cursor:pointer;text-align:left;width:100%}
.mini-np .tt{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.mini-np .tt span:first-child{font-size:14px}
.mini-np .tt span:last-child{font-size:12px;color:var(--sub)}

/* main */
main{flex:1;min-width:0;box-sizing:border-box;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.col{max-width:1000px;margin:0 auto;display:flex;flex-direction:column}

/* flow steps */
.steps{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 18px;align-items:center;font-size:13px;color:var(--mute)}
.step{display:flex;align-items:center;gap:8px}
.step i{width:20px;height:20px;border-radius:50%;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:11px}
.step.on{color:var(--fg)}
.step.on i{border-color:var(--accent);color:var(--accent)}
.step.done i{background:var(--raise);color:var(--sub)}
.guide{text-align:center;margin:10px 0 0;font-size:14px;color:var(--sub);min-height:20px}

/* track */
.track{display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px;margin-top:40px}
.track .t{font-size:26px;font-weight:400}
.track .a{font-size:15px;color:var(--sub);margin-top:4px}

/* waveform */
.wfwrap{margin-top:48px;position:relative}
.wcap{text-align:center;font-size:13px;color:var(--mute);min-height:18px;margin-top:10px;margin-bottom:40px}
.pcol{min-height:calc(100vh - 100px)}
.pbar{position:sticky;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:8;margin-top:auto;box-sizing:border-box;background:var(--bg);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding:8px 0}
.pbar .pl{font-size:13px;color:var(--mute);white-space:nowrap}
.pbar .pl .now{color:var(--fg)}
.pbar .pr{display:flex;align-items:center;justify-content:flex-end;gap:10px;color:var(--sub)}
.pbar .play{width:52px;height:52px}
.pbar .tp{gap:14px}
.ib[aria-pressed="true"]{color:var(--accent)}
#wf{position:relative;height:160px;touch-action:none;cursor:crosshair;user-select:none;-webkit-user-select:none}
#bars{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between}
#bars i{display:block;width:2px;border-radius:1px;flex:none}
.band{position:absolute;top:8px;bottom:8px;border-radius:8px;pointer-events:none}
.band.sel{background:rgba(142,197,184,.06);border:1px solid rgba(142,197,184,.25)}
.band.saved{background:rgba(142,197,184,.035)}
#ph{position:absolute;top:-6px;bottom:-6px;width:1px;background:rgba(220,220,224,.5);pointer-events:none}
.savedots{position:relative;height:12px}
.savedots b{position:absolute;top:3px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--accent)}
#tbwrap{position:relative;height:0;transition:height .2s ease}
#tbwrap.on{height:58px}
.tb{position:absolute;top:10px;height:44px;box-sizing:border-box;display:flex;align-items:center;gap:2px;padding:0 4px 0 14px;background:var(--panel);border:1px solid var(--line2);border-radius:12px;white-space:nowrap;z-index:3;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.tb .rng{font-size:13px;color:var(--sub);padding-right:10px;margin-right:2px;border-right:1px solid var(--line2)}
.tbb{height:36px;padding:0 10px;border:0;border-radius:8px;background:none;display:flex;align-items:center;gap:7px;font-size:14px;cursor:pointer}
.tbb:hover{background:var(--raise)}
.tbb[aria-pressed="true"]{background:var(--raise);color:var(--accent)}
.tbx{width:32px;height:36px;border:0;background:none;color:var(--mute);cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:8px}

/* time + controls */
.timerow{display:flex;justify-content:space-between;margin-top:8px;font-size:13px;color:var(--mute)}
.timerow .now{color:var(--fg)}
.ctl{display:flex;justify-content:center;margin-top:22px}
.tp{display:flex;align-items:center;justify-content:center;gap:20px}
.tp .side-b{color:var(--sub)}
.ib{width:44px;height:44px;border:0;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:50%}
.ib:hover{background:var(--raise)}
.play{width:68px;height:68px;border:1px solid rgba(220,220,224,.45);border-radius:50%;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
.right{display:flex;align-items:center;justify-content:flex-end;gap:10px}
.vol{width:110px;accent-color:#A1A1A6}
.loopflag{font-size:13px;color:var(--accent)}

/* the slot below the controls: describe / suggestion */
.slot{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s ease;margin-top:4px}
.slot.open{grid-template-rows:1fr}
.slot>div{overflow:hidden;min-height:0}
.card{border:1px solid var(--line2);background:var(--panel);border-radius:16px;padding:20px 22px}
.dhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.dhead h2{margin:0;font-size:17px;font-weight:500}
.dhead .rng{font-size:13px;color:var(--sub);display:flex;align-items:center;gap:8px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:22px}
.dcol{display:flex;flex-direction:column;gap:10px;min-width:0}
.lbl{font-size:13px;color:var(--sub)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line2);background:none;color:#B4B4B9;font-size:13px;cursor:pointer}
.chip.sq{border-radius:8px}
.chip[aria-pressed="true"]{background:rgba(220,220,224,.12);color:var(--fg);border-color:rgba(220,220,224,.35)}
textarea{box-sizing:border-box;width:100%;resize:none;padding:10px 12px;background:var(--bg);border:1px solid var(--line2);border-radius:10px;color:var(--fg);font:14px/1.45 var(--sans)}
textarea::placeholder{color:var(--mute)}
.dfoot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.note{font-size:13px;color:var(--mute)}
.btns{display:flex;gap:8px}
.primary{height:38px;padding:0 18px;border-radius:19px;border:0;background:var(--fg);color:#111113;font-size:14px;font-weight:500;cursor:pointer}
.ghost{height:38px;padding:0 14px;border-radius:19px;border:0;background:none;color:var(--sub);font-size:14px;cursor:pointer}
.ghost:hover{color:var(--fg)}
.outline{height:38px;padding:0 16px;border-radius:19px;border:1px solid var(--line2);background:none;font-size:14px;cursor:pointer}
.strip{border:1px solid var(--line2);background:var(--panel);border-radius:12px;padding:2px 10px;display:flex;flex-direction:column}
.srow{display:flex;align-items:center;gap:8px;min-height:40px}
.sdiv{flex:none;width:1px;height:18px;background:var(--line2);margin:0 6px}
.srow+.srow{border-top:1px solid var(--line)}
.slbl{flex:none;width:40px;font-size:12px;color:var(--mute)}
.srow+.srow{border-top:1px solid var(--line)}
.schips{display:flex;align-items:center;gap:5px;overflow-x:auto;scrollbar-width:none;min-width:0;flex:1}
.schips::-webkit-scrollbar{display:none}
.schips .chip{flex:none;height:28px;padding:0 10px;font-size:12px}
.sin{flex:1;min-width:0;height:30px;box-sizing:border-box;padding:0 12px;background:var(--bg);border:1px solid var(--line2);border-radius:8px;color:var(--fg);font:14px var(--sans)}
.sin::placeholder{color:var(--mute)}
.srow .primary,.srow .ghost{height:30px;flex:none;font-size:13px;padding:0 12px}
.nudge{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.nudge .q{display:flex;align-items:center;gap:12px}
.nudge .q small{display:block;color:var(--sub);font-size:13px;margin-top:3px}

/* pages */
.ph1{font-size:30px;font-weight:400;margin:0}
.lead{color:var(--sub);margin:8px 0 0;line-height:1.5;max-width:60ch}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-top:26px}
.tab{height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line2);background:none;color:#B4B4B9;font-size:14px;cursor:pointer}
.tab[aria-selected="true"]{background:rgba(220,220,224,.12);color:var(--fg);border-color:rgba(220,220,224,.35)}
.list{list-style:none;margin:20px 0 0;padding:0;border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:18px;padding:14px 0;border-bottom:1px solid var(--line)}
.row .mw{width:150px;height:30px;display:flex;align-items:center;justify-content:space-between;flex:none}
.row .mw i{display:block;width:2px;border-radius:1px}
.row .info{flex:1;min-width:0}
.row .info .s{font-size:16px}
.row .info .s span{color:var(--mute)}
.row .info .w{font-size:13px;color:var(--sub);margin-top:3px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tags span{font-size:12px;color:var(--sub);border:1px solid var(--line2);border-radius:6px;padding:2px 7px}
.row .r{font-size:13px;color:var(--mute);white-space:nowrap}
.cplay{width:40px;height:40px;flex:none;border:1px solid var(--line2);border-radius:50%;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
.cplay:hover{border-color:var(--sub)}
.new{color:var(--accent);font-size:12px;margin-left:6px}
.dnawrap{display:flex;flex-wrap:wrap;gap:40px;margin-top:30px;align-items:flex-start}
#ring{position:relative;width:200px;height:200px;flex:none}
#ring .rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--sub)}
#ring .rn{font-size:40px;font-weight:300;line-height:1;color:var(--fg)}
.dtop{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:16px}
.sum{display:flex;flex-wrap:wrap;align-items:center;gap:20px 40px;margin-top:28px;padding:24px;border:1px solid var(--line);border-radius:16px}
.sum .txt{flex:1 1 100%;border-top:1px solid var(--line);padding-top:18px}
.legend{flex:1;min-width:220px;display:flex;flex-direction:column;gap:2px}
.lg{display:flex;align-items:center;gap:12px;height:40px;border:0;background:none;border-radius:8px;padding:0 10px;cursor:pointer;font-size:15px;color:var(--sub);text-align:left}
.lg:hover,.lg[aria-pressed="true"]{background:var(--raise);color:var(--fg)}
.lg i{width:10px;height:10px;border-radius:3px;flex:none}
.lg .ln{flex:1}
.lg .lv{font-size:14px;color:var(--fg)}
#ring svg{display:block}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--mute)}
.sum .big{font-size:20px;line-height:1.45;margin:8px 0 14px;text-wrap:balance}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--sub)}
.facts b{font-weight:500;color:var(--fg)}
.sh{font-size:18px;font-weight:500;margin:52px 0 4px}
.shs{font-size:13px;color:var(--mute);margin:0 0 12px}
.trait .nm small{display:block;font-size:13px;color:var(--mute);margin-top:3px}
.chk{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
.traits{border-top:1px solid var(--line)}
.trait{width:100%;min-height:68px;border:0;background:none;display:flex;align-items:center;gap:14px;cursor:pointer;text-align:left;padding:0 2px;color:#B4B4B9}
.trait .nm{flex:1;font-size:16px}
.trait .bar{width:90px;height:2px;background:var(--line2);position:relative;flex:none}
.trait .bar i{position:absolute;left:0;top:0;height:2px;background:var(--mute)}
.trait .ct{width:96px;text-align:right;font-size:13px;color:var(--sub)}
.trait .d{width:7px;height:7px;border-radius:50%;background:var(--off);flex:none}
.trait[aria-expanded="true"]{color:var(--fg)}
.trait[aria-expanded="true"] .d,.trait[aria-expanded="true"] .bar i{background:var(--accent)}
.ev{padding:2px 0 16px 21px;display:flex;flex-direction:column}
.evr{display:flex;align-items:center;gap:12px;min-height:46px;font-size:14px}
.evr .x{flex:1;min-width:0}
.evr .x span{color:var(--mute)}
.disc{font-size:12px;color:var(--mute);margin-top:16px;text-align:center}

/* library / discover / ask / signals */
.pill{font-size:12px;border-radius:10px;padding:2px 8px;border:1px solid var(--line2);color:var(--sub);white-space:nowrap;background:none}
.pill.ok{color:var(--accent);border-color:rgba(142,197,184,.3)}
button.pill{cursor:pointer;margin:0 10px}
.local{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute);margin:14px 0 0}
.lrow{display:flex;align-items:center;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
.lrow .info{flex:1;min-width:0}
.lrow .s{font-size:15px}.lrow .s span{color:var(--mute)}
.lrow .meta{font-size:12px;color:var(--mute);margin-top:3px}
.prog{width:80px;height:2px;background:var(--line2);position:relative;flex:none}.prog i{position:absolute;left:0;top:0;height:2px;background:var(--sub)}
.interest{position:relative;height:6px}
.interest b{position:absolute;top:2px;height:0;border-top:1px dashed var(--mute)}
.ask{display:flex;align-items:center;gap:8px;min-height:44px;padding:4px 10px;border:1px solid var(--line2);background:var(--panel);border-radius:12px;overflow-x:auto;scrollbar-width:none}
.ask::-webkit-scrollbar{display:none}
.ask .qq{flex:none;font-size:14px;display:flex;align-items:center;gap:8px;margin-right:4px}
.ask .chip{flex:none;height:28px;font-size:12px;padding:0 10px}
.ask .ghost{flex:none;height:28px;font-size:13px;padding:0 10px;margin-left:auto}
.drow{padding:16px 0;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px}
.drow .info{flex:1;min-width:220px}
.drow .why{font-size:13px;color:var(--sub);margin-top:4px;line-height:1.45}
.drow .why b{font-weight:400;color:var(--accent)}
.genre{font-size:12px;color:var(--mute);margin-left:8px;border:1px solid var(--line2);border-radius:6px;padding:1px 6px}
.switch{display:flex;align-items:center;gap:10px;border:0;background:none;color:var(--sub);font-size:14px;cursor:pointer;padding:0;height:36px}
.switch .k{width:34px;height:20px;border-radius:10px;background:var(--line2);position:relative}
.switch .k::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:var(--sub);transition:left .2s}
.switch[aria-checked="true"] .k{background:rgba(142,197,184,.35)}
.switch[aria-checked="true"] .k::after{left:16px;background:var(--fg)}
.sigs{list-style:none;margin:12px 0 0;padding:0;border-top:1px solid var(--line)}
.sigs li{display:flex;gap:12px;align-items:baseline;font-size:14px;padding:10px 0;border-bottom:1px solid var(--line)}
.sigs li span:first-child{flex:1}
.sigs li span:last-child{font-size:12px;color:var(--mute);white-space:nowrap}
.h2{font-size:18px;font-weight:500;margin:44px 0 0;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.trait .conf{font-size:12px;color:var(--mute);width:64px}
.evr .an{display:block;font-size:12px;color:var(--mute);margin-top:2px}
.across{font-size:13px;color:var(--sub);margin:2px 0 6px}
@media (max-width:600px){.trait .bar,.trait .conf{display:none}.lrow .prog{display:none}}


.ringstage{position:relative;height:420px;margin-top:8px}
.ringstage #ring{position:absolute;left:50%;top:50%;width:300px;height:300px;margin:-150px 0 0 -150px}
#ring .rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;color:var(--mute);text-align:center}
#ring .rn{font-size:52px;font-weight:300;line-height:1;color:var(--fg)}
#ring .rt{font-size:15px;color:var(--fg);max-width:160px}
.rlab{position:absolute;border:0;background:none;cursor:pointer;display:flex;flex-direction:column;gap:2px;padding:6px 8px;border-radius:8px;color:var(--sub);font-size:13px;white-space:nowrap}
.rlab b{font-size:20px;font-weight:400;color:var(--fg)}
.rlab:hover,.rlab.on{color:var(--fg)}
.rlab.on b{color:var(--accent)}
.rchips{display:none;flex-wrap:wrap;justify-content:center;gap:6px}
.portrait{font-size:clamp(20px,2.6vw,26px);font-weight:300;line-height:1.5;text-align:center;max-width:760px;margin:18px auto 0;text-wrap:balance}
.pw{font:inherit;color:var(--fg);background:none;border:0;padding:0;cursor:pointer;border-bottom:1px solid rgba(142,197,184,.45)}
.pw:hover,.pw.on{color:var(--accent)}
.pmeta{text-align:center;font-size:13px;color:var(--mute);margin:12px 0 0}
.tgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:44px}
.tcard{border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px;background:var(--side)}
.tcard.on{border-color:rgba(142,197,184,.45)}
.thead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.thead h3{margin:0;font-size:17px;font-weight:500;line-height:1.3}
.meter{display:flex;gap:3px;align-items:flex-end;flex:none;padding-top:4px}
.meter i{width:4px;height:14px;border-radius:2px;background:var(--line2)}
.meter i:nth-child(1){height:6px}.meter i:nth-child(2){height:9px}.meter i:nth-child(3){height:12px}
.meter i.f{background:var(--accent)}
.tdesc{margin:0;font-size:14px;color:var(--sub);line-height:1.45}
.hear{display:flex;align-items:center;gap:12px;font-size:14px}
.hear b{font-weight:500}
.hear small{display:block;color:var(--mute);font-size:12px;margin-top:2px}
.cask{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--sub)}
.cask span{margin-right:auto}
.mini{height:30px;padding:0 12px;border-radius:15px;border:1px solid var(--line2);background:none;font-size:13px;cursor:pointer}
.mini:hover{border-color:var(--sub)}
.cnote{margin:0;font-size:13px;color:var(--accent)}
.more{margin-top:auto;align-self:flex-start;border:0;background:none;padding:0;color:var(--sub);font-size:13px;cursor:pointer;text-align:left}
.more:hover{color:var(--fg)}
.tdetail{margin-top:14px;border:1px solid var(--line);border-radius:16px;padding:18px 20px}

        ['Vocals','Melody','Instruments','Rhythm','Build-up'].map(function(o){return '<button type="button" class="chip sq" data-act="answer" data-v="'+o+'">'+o+'</button>';}).join('')+
        '<button type="button" class="chip sq" data-act="more">More…</button>'+
        '<button class="ghost" data-act="skipask">Skip</button></section>';
    } else if(S.nudge&&S.sel){
      html='<section class="card nudge" aria-label="Suggestion"><div class="q">'+svg('i-heart',18)+'<div>Enjoying this moment?<small>You have played '+fmt(S.sel.a)+' – '+fmt(S.sel.b)+' '+(S.loops+1)+' times.</small></div></div>'+
        '<div class="btns"><button class="ghost" data-act="dismiss">Not now</button><button class="primary" data-act="save">Save moment</button></div></section>';
    }
    var open=!!html;
    if(open)inn.innerHTML=html;
    if(instant){slot.style.transition='none';slot.classList.toggle('open',open);slot.offsetHeight;slot.style.transition='';}
    else{requestAnimationFrame(function(){slot.classList.toggle('open',open);});}
    if(!open)setTimeout(function(){if(!slot.classList.contains('open'))inn.innerHTML='';},300);
    var ta=$('note');if(ta)ta.addEventListener('input',function(){S.note=ta.value;});
  }
  function refreshPlayerState(){
    var st=step();
    document.querySelectorAll('.step').forEach(function(el,i){var k=i+1;el.className='step'+(k===st?' on':(k<st?' done':''));});
    if($('guide'))$('guide').textContent=GUIDE[st];
    var lb=$('lpb');if(lb)lb.setAttribute('aria-pressed',S.loop&&!!S.sel);
    var pb=document.querySelector('.play');if(pb){pb.innerHTML=svg(S.playing?'i-pause':'i-play',20);pb.setAttribute('aria-label',S.playing?'Pause':'Play');}
    drawWave();drawToolbar();
  }

  function bindWave(){
    var wf=$('wf'),x0=null,drag=false;
    function tAt(e){var r=wf.getBoundingClientRect();return Math.max(0,Math.min(DUR,(e.clientX-r.left)/r.width*DUR));}
    wf.addEventListener('pointerdown',function(e){x0=tAt(e);drag=false;wf.setPointerCapture(e.pointerId);});
    wf.addEventListener('pointermove',function(e){
      if(x0===null)return;var t=tAt(e);
      if(!drag&&Math.abs(t-x0)>2){drag=true;S.describe=null;S.ask=null;S.loop=false;S.loops=0;S.nudge=false;S.justSaved=false;drawSlot();}
      if(drag){S.sel={a:Math.min(x0,t),b:Math.max(x0,t)};drawWave();drawToolbar();}
    });
    wf.addEventListener('pointerup',function(e){
      if(x0===null)return;var t=tAt(e);
      if(!drag){
        if(t<S.t-3)noteRewind(t);
        if(S.sel&&t>=S.sel.a&&t<=S.sel.b){S.t=t;}
        else{S.t=t;S.sel=null;S.describe=false;S.loop=false;S.nudge=false;drawSlot();}
      } else if(S.sel.b-S.sel.a<3){S.sel.b=Math.min(DUR,S.sel.a+3);}
      x0=null;refreshPlayerState();
    });
    wf.addEventListener('keydown',function(e){
      if(e.key==='ArrowRight'){S.t=Math.min(DUR,S.t+5);drawWave();e.preventDefault();}
      if(e.key==='ArrowLeft'){S.t=Math.max(0,S.t-5);drawWave();e.preventDefault();}
      if(e.key==='Enter'&&!S.sel){S.sel={a:Math.max(0,S.t-10),b:Math.min(DUR,S.t+10)};refreshPlayerState();}
    });
  }

  /* ---------- passive signals ---------- */
  function logSig(text,n){
    var f=SIG.filter(function(s){return s.text===text;})[0];
    if(f){SIG.splice(SIG.indexOf(f),1);f.n=n;f.when='Just now';SIG.unshift(f);}else SIG.unshift({text:text,n:n,when:'Just now'});
  }
  function noteRewind(to){
    if(!S.learning)return;
    var r=null;S.interest.forEach(function(x){if(Math.abs(x.a-to)<10)r=x;});
    if(r)r.n++;else{r={a:to,b:Math.min(DUR,to+14),n:1};S.interest.push(r);}
    logSig('Replayed '+fmt(r.a)+' – '+fmt(r.b)+' in Halflight',r.n);
    if(r.n>=3&&!r.asked&&!S.describe){r.asked=true;S.ask={q:'You keep coming back to '+fmt(r.a)+'. What is it?',a:r.a,b:r.b};drawSlot();}
  }

  /* ---------- saving ---------- */
  function addMoment(r){
    var id=nextId++;S.saved.push({a:r.a,b:r.b});
    MOMENTS.unshift({id:id,song:'Halflight',artist:'Ines Moreau',what:'Saved moment',a:r.a,b:r.b,coll:[],tags:[],note:'',seed:30+id,fresh:true});
    return id;
  }
  function applyTags(mid,r,feel,love,note){
    var m=MOMENTS.filter(function(x){return x.id===mid;})[0];
    if(m){
      feel.concat(love).forEach(function(t){if(m.tags.indexOf(t)<0)m.tags.push(t);});
      if(love.length)m.what=love.join(' · ');if(note)m.note=note;
      [['Chills',0],['Nostalgia',1]].forEach(function(p){if(feel.indexOf(p[0])>=0&&m.coll.indexOf(p[1])<0)m.coll.push(p[1]);});
      if(love.indexOf('Melody')>=0&&m.coll.indexOf(2)<0)m.coll.push(2);
    }
    var hit={};love.forEach(function(l){var k=TRAIT_OF[l];if(k!==undefined&&!hit[k]){hit[k]=1;TRAITS[k].n++;TRAITS[k].items.unshift(['Halflight','Ines Moreau',r.a,r.b,true,'You said: '+love.join(', ').toLowerCase()]);}});
    return Object.keys(hit).map(function(k){return TRAITS[k].short;});
  }
  function saveMoment(){
    var r=S.sel;if(!r)return;
    var id=addMoment(r);
    S.sel=null;S.describe=null;S.loop=false;S.loops=0;S.nudge=false;S.justSaved=true;
    S.ask=S.learning?{q:'Saved. What stood out?',a:r.a,b:r.b,mid:id}:null;
    drawSlot();refreshPlayerState();renderShell();
    toast('Saved to My Moments','View','moments');
  }

  /* ---------- moments ---------- */
  function miniBars(seed,a,b,len){
    var s=seed,h='';len=len||Math.max(b+20,260);
    for(var i=0;i<40;i++){s=(s*9301+49297)%233280;var t=i/39,ts=t*len,v=Math.max(2,Math.round(Math.pow(Math.sin(Math.PI*t),.5)*(.3+.7*s/233280)*28));h+='<i style="height:'+v+'px;background:'+((ts>=a&&ts<=b)?'var(--accent)':'var(--off)')+'"></i>';}
    return h;
  }

      '<ol class="list">'+(list.length?list.map(function(m){

  /* ---------- discover ---------- */
  function renderDiscover(){
    var tabs=['For all my moments'].concat(TRAITS.map(function(t){return t.short;}));
    var list=DISC.filter(function(d){return S.dtab===0||d.trait===S.dtab-1;});
    var rows=list.map(function(d){
      var fb=S.dfb[d.id],act,pv=S.preview===d.id;

      '<ol class="list">'+(rows||'<li class="drow note">Nothing for this trait yet.</li>')+'</ol></div>';

  /* ---------- dna ---------- */
  function renderDNA(){
    var total=TRAITS.reduce(function(s,t){return s+t.n;},0),cur=S.trait;
    var artists={};TRAITS.forEach(function(t){t.items.forEach(function(p){artists[p[1]]=1;});});
    function level(t){return t.n>=10?4:(t.n>=8?3:(t.n>=6?2:1));}
    function word(t){return ['','Emerging','Growing','Growing','Strong'][level(t)];}
    function pct(t){return Math.round(t.n/total*100);}
    var LBL=['Vocal lifts','Build-ups','Textures','Chord turns'];
    /* ring geometry */
    var R=150,T=0;TRAITS.forEach(function(t){T+=t.n*3+3;});
    var labels='',chipsM='',pos=0;
    TRAITS.forEach(function(t,i){
      var span=t.n*3,mid=(pos+span/2)/T*2*Math.PI;pos+=span+3;
      var x=Math.sin(mid),y=-Math.cos(mid),right=x>=0;
      labels+='<button class="rlab'+(cur===i?' on':'')+'" data-act="trait" data-v="'+i+'" style="left:calc(50% + '+Math.round(x*(R+46))+'px);top:calc(50% + '+Math.round(y*(R+34))+'px);transform:translate('+(right?'0':'-100%')+',-50%);text-align:'+(right?'left':'right')+'"><b>'+pct(t)+'%</b><span>'+LBL[i]+'</span></button>';
      chipsM+='<button class="tab" data-act="trait" data-v="'+i+'" aria-selected="'+(cur===i)+'">'+LBL[i]+' '+pct(t)+'%</button>';
    });
    var c=cur>=0?TRAITS[cur]:null;
    var center=c?'<span class="rn">'+pct(c)+'%</span><span class="rt">'+c.short+'</span><span>of your saved moments</span>':'<span class="rn">'+total+'</span><span class="rt">saved moments</span><span>tap a trait</span>';
    function w(i,txt){return '<button class="pw'+(cur===i?' on':'')+'" data-act="trait" data-v="'+i+'">'+txt+'</button>';}
    var portrait='You light up when '+w(0,'a voice lifts over the music')+', and you wait for '+w(1,'slow build-ups')+' to finally break. '+w(2,'Spacious textures')+' keep you listening, and now and then '+w(3,'an unexpected chord')+' gets you.';
    var cards=TRAITS.map(function(t,i){
      var lv=level(t),meter='';for(var k=1;k<=4;k++)meter+='<i class="'+(k<=lv?'f':'')+'"></i>';
      var top=t.items[0],ask='',open=cur===i;
      if(lv<4){
        ask=S.confirmed[i]?'<span class="cnote">Confirmed</span>':(S.misread[i]?'<span class="cnote" style="color:var(--mute)">Noted, weighed less</span>':
          '<div class="cask"><span>Is this you?</span><button class="mini" data-act="confirm" data-v="'+i+'">Yes</button><button class="mini" data-act="misread" data-v="'+i+'">Not really</button></div>');
      } else ask='<span class="cnote">Strong match</span>';
      var detail='';
      if(open){
        detail='<div class="tdetail"><p class="across">'+esc(t.across)+'</p>'+
          t.items.map(function(p,j){return '<div class="evr"><button class="cplay" style="width:34px;height:34px" data-act="playev" data-v="'+i+','+j+'" aria-label="Play">'+svg('i-play',11)+'</button><span class="x">'+esc(p[0])+' <span>— '+esc(p[1])+'</span>'+(p[4]?'<span class="new">New</span>':'')+(p[5]?'<span class="an">'+esc(p[5])+'</span>':'')+'</span><span style="font-size:13px;color:var(--sub)">'+fmt(p[2])+' – '+fmt(p[3])+'</span><button class="ghost" style="height:34px;font-size:13px" data-act="rmev" data-v="'+i+','+j+'">Remove</button></div>';}).join('')+
          '<div class="dfoot2">'+(t.n>t.items.length?'<span class="note">+ '+(t.n-t.items.length)+' more in your library</span>':'<span></span>')+'<button class="ghost" style="padding:0;font-size:13px" data-act="disc" data-v="'+i+'">Find unfamiliar moments like these →</button></div></div>';
      }
      return '<div class="trow'+(open?' on':'')+'">'+
        '<button class="tmain" data-act="trait" data-v="'+i+'" aria-expanded="'+open+'"><span class="meter" title="'+word(t)+'">'+meter+'</span><span class="tname">'+t.name+'<small>'+esc(t.desc)+' · '+t.n+' moments</small></span></button>'+
        (top?'<div class="hear"><button class="cplay" style="width:34px;height:34px" data-act="playev" data-v="'+i+',0" aria-label="Play '+esc(top[0])+'">'+svg('i-play',11)+'</button><span><b>'+esc(top[0])+'</b> '+fmt(top[2])+'–'+fmt(top[3])+'<small>'+esc(top[5]||'')+'</small></span></div>':'')+
        '<div class="tans">'+ask+'</div>'+detail+'</div>';
    }).join('');
    var detail='';
    var sigs=SIG.slice(0,6).map(function(s){return '<li><span>'+esc(s.text)+(s.n>1?' · '+s.n+' times':'')+'</span><span>'+esc(s.when)+'</span></li>';}).join('');
    $('main').innerHTML='<div class="col">'+
      '<div class="dtop"><h1 class="ph1">My Music DNA</h1><button class="switch" role="switch" aria-checked="'+S.learning+'" data-act="learn"><span class="k"></span>Learning '+(S.learning?'on':'paused')+'</button></div>'+
      '<div class="ringstage"><div id="ring" role="img" aria-label="Ring of your saved moments, grouped by trait"><div class="rc">'+center+'</div></div>'+labels+'</div>'+
      '<div class="rchips">'+chipsM+'</div>'+
      '<p class="portrait">'+portrait+'</p>'+
      '<p class="pmeta">Drawn from '+total+' moments by '+Object.keys(artists).length+' artists · illustrative, not real predictions</p>'+
      '<h2 class="sh">Your traits</h2><p class="shs">Strongest first. Tap a trait to hear every moment behind it, or play its best example.</p><div class="tlist">'+cards+'</div>'+
      '<details class="how"><summary>How Music DNA learned this</summary><p class="shs" style="margin-top:10px">Hints from how you listen, not conclusions.'+(S.learning?'':' Learning is paused, so nothing new is recorded.')+'</p><ul class="sigs">'+sigs+'</ul></details>'+
    '</div>';
    var ring=$('ring'),idx=0,seed=5,frag=document.createDocumentFragment();
    TRAITS.forEach(function(t,ti){
      var span=t.n*3;
      for(var k=0;k<span;k++){seed=(seed*9301+49297)%233280;var len=Math.round(12+24*(seed/233280)*Math.sin(Math.PI*(k+.5)/span));frag.appendChild(tick(idx++,len,ti===cur?'var(--accent)':(cur===-1?'#B4B4B9':'#4A4A50')));}
      for(var g=0;g<3;g++)frag.appendChild(tick(idx++,4,'#26262A'));
    });
    function tick(i,len,col){var e=document.createElement('div');e.style.cssText='position:absolute;left:'+(R-1)+'px;top:0;width:2px;height:'+len+'px;border-radius:1px;background:'+col+';transform-origin:1px '+R+'px;transform:rotate('+(i/T*360)+'deg)';return e;}
    ring.insertBefore(frag,ring.firstChild);
  }

  /* ---------- routing / actions ---------- */
  function render(){
    renderShell();
    if(S.view==='player')renderPlayer();else if(S.view==='moments')renderMoments();else if(S.view==='library')renderLibrary();else if(S.view==='discover')renderDiscover();else renderDNA();
    window.scrollTo(0,0);
  }
  var toastT;
  function toast(msg,label,view){
    var el=$('toast');el.innerHTML='<span>'+esc(msg)+'</span>'+(label?'<button data-act="go" data-v="'+view+'">'+label+'</button>':'');
    el.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){el.hidden=true;},5000);
  }
  function openInPlayer(a,b){S.view='player';S.sel={a:a,b:b};S.t=a;S.playing=true;S.loop=false;S.describe=false;S.nudge=false;S.justSaved=false;render();}
  function toggle(arr,v){var i=arr.indexOf(v);if(i>=0)arr.splice(i,1);else arr.push(v);}

  document.addEventListener('click',function(e){
    var el=e.target.closest('[data-act]');if(!el)return;
    var a=el.dataset.act,v=el.dataset.v;
    switch(a){
      case 'go': S.view=v;$('toast').hidden=true;render();break;
      case 'coll': S.view='moments';S.tab=+v;render();break;
      case 'tab': S.tab=+v;renderMoments();renderShell();break;
      case 'play': S.playing=!S.playing;refreshPlayerState();break;
      case 'seek': var to=Math.max(0,Math.min(DUR,S.t+(+v)));if(+v<0)noteRewind(to);S.t=to;drawWave();break;
      case 'answer': var A=S.ask;S.ask=null;
        var an=applyTags(A.mid,A,[],[v],'');
        logSig('You said it was the '+v.toLowerCase()+' at '+fmt(A.a)+' in Halflight',1);
        drawSlot();refreshPlayerState();toast('Thanks. Added to '+an.join(', ')+'.','See Music DNA','dna');break;
      case 'skipask': S.ask=null;drawSlot();refreshPlayerState();break;
      case 'learn': S.learning=!S.learning;if(!S.learning)S.ask=null;renderDNA();renderShell();break;
      case 'confirm': S.confirmed[+v]=true;renderDNA();break;
      case 'disc': S.view='discover';S.dtab=+v+1;render();break;
      case 'dtab': S.dtab=+v;renderDiscover();break;
      case 'preview': S.preview=(S.preview===v)?null:v;if(S.preview)S.playing=false;renderDiscover();renderShell();break;
      case 'dno': S.dfb[v]='no';renderDiscover();break;
      case 'dwhy': S.dfb[v]='done';var dd=DISC.filter(function(x){return x.id===v;})[0];logSig('Not quite: '+dd.song+' ('+el.textContent.toLowerCase()+')',1);renderDiscover();break;
      case 'dyes': S.dfb[v]='yes';var d=DISC.filter(function(x){return x.id===v;})[0];
        MOMENTS.unshift({id:nextId++,song:d.song,artist:d.artist,what:'From Discover · '+d.why,a:d.a,b:d.b,coll:[],tags:[d.genre],seed:40+nextId,fresh:true});
        TRAITS[d.trait].n++;TRAITS[d.trait].items.unshift([d.song,d.artist,d.a,d.b,true,d.why]);
        renderDiscover();renderShell();toast('Added to My Moments and '+TRAITS[d.trait].short+'.','View','moments');break;
      case 'import': S.imported=true;
        [['Night Ferry','Aster Vale',214],['Copper Light','June Okafor',262],['Les Heures','Camille Roux',238]].forEach(function(x,j){LIB.push({song:x[0],artist:x[1],dur:x[2],st:-j*40});});
        renderLibrary();renderShell();toast('Added 3 songs. Analysing them on this device.');break;
      case 'playlib': var tr=LIB[+v];if(tr.song==='Halflight'){S.view='player';render();}else toast('In this prototype only Halflight plays.');break;
      case 'clear': S.sel=null;S.describe=false;S.loop=false;S.nudge=false;drawSlot();refreshPlayerState();break;
      case 'loop': if(!S.sel){toast('Select a passage on the waveform to loop it.');break;}S.loop=!S.loop;S.loops=0;if(S.loop&&S.sel)S.t=S.sel.a;refreshPlayerState();break;
      case 'more': var M=S.ask;S.ask=null;S.describe={a:M.a,b:M.b,mid:M.mid};S.feel=[];S.love=[];S.note='';drawSlot();refreshPlayerState();
        setTimeout(function(){var s=$('slot');if(s&&s.getBoundingClientRect().bottom>innerHeight)s.scrollIntoView({behavior:'smooth',block:'end'});},300);break;
      case 'closedesc': S.describe=null;drawSlot();refreshPlayerState();break;
      case 'dsave': var D=S.describe,did=D.mid||addMoment(D),dn=applyTags(did,D,S.feel,S.love,S.note);
        S.describe=null;S.justSaved=true;S.feel=[];S.love=[];S.note='';drawSlot();refreshPlayerState();renderShell();
        toast((D.mid?'Moment updated':'Saved to My Moments')+(dn.length?' · added to '+dn.join(', '):''),'View','moments');break;
      case 'dismiss': S.nudge=false;S.nudged=true;drawSlot();break;
      case 'feel': toggle(S.feel,v);el.setAttribute('aria-pressed',S.feel.indexOf(v)>=0);break;
      case 'love': toggle(S.love,v);el.setAttribute('aria-pressed',S.love.indexOf(v)>=0);break;
      case 'save': saveMoment();break;
      case 'quicksave': S.sel={a:Math.max(0,S.t-20),b:S.t};saveMoment();break;
      case 'playm': var m=MOMENTS.filter(function(x){return x.id===+v;})[0];
        if(m.song==='Halflight')openInPlayer(m.a,m.b);else toast('In this prototype only Halflight plays. '+m.song+' would start at '+fmt(m.a)+'.');break;
      case 'playall': openInPlayer(MOMENTS[0].a,MOMENTS[0].b);break;
      case 'trait': S.trait=(S.trait===+v)?-1:+v;renderDNA();break;
      case 'playev': var p=v.split(','),it=TRAITS[+p[0]].items[+p[1]];
        if(it[0]==='Halflight')openInPlayer(it[2],it[3]);else toast('In this prototype only Halflight plays.');break;
      case 'rmev': var q=v.split(',');TRAITS[+q[0]].items.splice(+q[1],1);TRAITS[+q[0]].n=Math.max(TRAITS[+q[0]].items.length,TRAITS[+q[0]].n-1);renderDNA();break;
      case 'misread': S.misread[+v]=true;renderDNA();break;
    }
  });

  /* ---------- playback clock ---------- */
  setInterval(function(){
    if(!S.playing)return;
    S.t+=.25;
    if(S.loop&&S.sel&&S.t>=S.sel.b){
      S.t=S.sel.a;S.loops++;
      if(S.learning)logSig('Looped '+fmt(S.sel.a)+' – '+fmt(S.sel.b)+' in Halflight',S.loops+1);
      if(S.loops>=2&&!S.nudged&&!S.describe&&S.view==='player'){S.nudge=true;S.nudged=true;drawSlot();}
    }
    if(S.t>=DUR)S.t=0;
    if(S.view==='player')drawWave();
    else{var n1=$('sidenp'),n2=$('mobnp');[n1,n2].forEach(function(n){var s=n&&n.querySelector('.tt span:last-child');if(s)s.textContent='Ines Moreau · '+fmt(S.t);});}
  },250);

  setInterval(function(){
    var ch=false;LIB.forEach(function(t){if(t.st<100){t.st=Math.min(100,t.st+8);ch=true;}});
    if(ch&&S.view==='library')renderLibrary();
  },500);

  var rz;window.addEventListener('resize',function(){clearTimeout(rz);rz=setTimeout(function(){if(S.view==='player'){drawWave();drawToolbar();}},80);});
  render();
})();
</script>
